<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emprendimiento 1 · S25 · El Pitch en vivo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f7fc;--card:#ffffff;--line:rgba(43,61,240,.28);--mut:#53627f;--or:#2b3df0;--gr:#12a150;--rd:#dc2626;--ink:#0f1b33;--serif:'Space Grotesk','Inter',system-ui,sans-serif}
body{background:radial-gradient(900px 500px at 90% -10%,#cfe0ff 0%,transparent 60%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
header b{color:#0f1b33}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:6px}
.dot.ok{background:var(--gr)}.dot.bad{background:var(--rd)}
main{flex:1;padding:16px 14px 28px;max-width:560px;width:100%;margin:0 auto}
h1{font-family:var(--serif);font-size:25px;line-height:1.2;margin-bottom:8px}
.sub{color:var(--mut);font-size:15px;line-height:1.4;margin-bottom:14px}
.kick{display:inline-block;background:var(--ink);color:#f4f7fc;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:5px 11px;margin-bottom:12px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tm{border:3px solid var(--c,#555);background:var(--card);color:#0f1b33;border-radius:16px;padding:16px 8px;font:800 16px/1.2 inherit;cursor:pointer;min-height:64px}
.tm:active{transform:scale(.97)}
.tm:disabled{opacity:.35}
.me{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--c);border-radius:99px;padding:7px 14px;font-weight:800;font-size:14px}
.me a{color:var(--mut);font-weight:600;margin-left:6px;text-decoration:underline;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.wait{text-align:center;padding:34px 10px;color:var(--mut)}
.wait .big{font-size:54px;margin-bottom:10px}
.wait h1{color:#0f1b33}
.ring{width:42px;height:42px;border:5px solid #dbe3f3;border-top-color:var(--or);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.case{font-family:var(--serif);font-style:italic;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px;line-height:1.35}
.qq{font-family:var(--serif);font-size:21px;line-height:1.25;font-weight:700;margin-bottom:12px}
.op{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:2.5px solid var(--line);color:#0f1b33;border-radius:16px;padding:13px 12px;margin-bottom:10px;font:600 16px/1.25 inherit;cursor:pointer}
.op b{font-family:var(--serif);font-size:24px;color:var(--or)}
.op.on{border-color:var(--or);background:#e8edff}
.op.ok{border-color:var(--gr);background:#dcf5e4}.op.no{opacity:.5}.op.bad{border-color:var(--rd);background:#fde2e2}
.op:disabled{cursor:default}
.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.bets button{border:2.5px solid var(--line);background:#e9eff9;color:#0f1b33;border-radius:14px;font:800 20px/1 inherit;padding:14px 0;cursor:pointer}
.bets button.on{border-color:var(--or);background:#e8edff;color:var(--or)}
.go{width:100%;border:0;border-radius:16px;background:var(--or);color:#0f1b33fff;font:800 18px/1 inherit;padding:16px;cursor:pointer}
.go:disabled{background:#dbe3f3;color:#7b88a3}
.res{margin-top:10px;padding:13px 14px;border-radius:14px;font-weight:800;font-size:16px;background:#dcf5e4;color:var(--gr)}
.res.bad{background:#fde2e2;color:var(--rd)}.res.neu{background:#e8edff;color:var(--or)}
.sent{margin-top:6px;color:var(--mut);font-weight:600;font-size:14px;min-height:20px}
.bz{width:100%;aspect-ratio:1;max-height:56vh;border-radius:50%;border:8px solid #fff3;background:radial-gradient(circle at 35% 30%,#ff8a8a,#d9383e 60%,#7a1018);color:#0f1b33;font:900 34px/1 system-ui;letter-spacing:.04em;cursor:pointer;box-shadow:0 12px 40px #d9383e66}
.bz:active{transform:scale(.97)}
.bz:disabled{filter:grayscale(1);opacity:.4}
.lnk{color:var(--mut);text-decoration:underline;cursor:pointer;font-size:14px;display:inline-block;margin-top:14px}
footer{padding:10px 14px;text-align:center;color:#7a6a70;font-size:12px}
input{width:100%;padding:15px;margin-bottom:10px;border-radius:14px;border:2.5px solid var(--line);background:var(--card);color:#0f1b33;font:600 17px inherit}
textarea{width:100%;background:var(--card);color:#0f1b33;border:2.5px solid var(--line);border-radius:14px;padding:12px;font:600 17px/1.3 inherit;margin-bottom:10px;resize:none}
.wcard{background:var(--card);border:2.5px solid var(--c,#888);border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.wcard b{color:var(--c);font-size:14px}.wcard span{font-size:16px;line-height:1.3}.wcard em{color:var(--mut);font-size:13px}
.rxrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.rx{background:#e9eff9;border:2px solid var(--line);border-radius:12px;padding:8px 2px;font-size:24px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#0f1b33;cursor:pointer}
.rx small{font-size:10px;color:var(--mut)}.rx.on{border-color:var(--or);background:#e8edff}.rx:disabled:not(.on){opacity:.4}
.go{color:#fff}.tm,.op{color:#0f1b33}.wcard span{color:#0f1b33}textarea{color:#0f1b33}</style></head><body>
<header><span><span class="dot" id="dot"></span><span id="st">Conectando…</span></span><span id="who"></span></header>
<main id="m"></main>
<footer>Emprendimiento 1 · Sesión 25 · El Pitch · solo se usa tu nombre, tu equipo y tus respuestas</footer>
<script>
(function(){
'use strict';
function MQ(url,opt){
  opt=opt||{};
  var enc=new TextEncoder(),dec=new TextDecoder();
  var ws=null,buf=new Uint8Array(0),pid=0,pingT=null,rcT=null,subs=[],up=false,closed=false,wait=1500;
  var cid=opt.cid||('c'+Math.random().toString(36).slice(2,10));
  function cat(a,b){var r=new Uint8Array(a.length+b.length);r.set(a,0);r.set(b,a.length);return r;}
  function s2b(s){var b=enc.encode(s),r=new Uint8Array(b.length+2);r[0]=b.length>>8;r[1]=b.length&255;r.set(b,2);return r;}
  function rl(n){var a=[];do{var d=n%128;n=Math.floor(n/128);if(n>0)d|=128;a.push(d);}while(n>0);return new Uint8Array(a);}
  function pkt(h,body){var l=rl(body.length),r=new Uint8Array(1+l.length+body.length);r[0]=h;r.set(l,1);r.set(body,1+l.length);return r;}
  function send(p){try{if(ws&&ws.readyState===1)ws.send(p);}catch(e){}}
  function emit(s){if(opt.onState)opt.onState(s,api);}
  function connect(){
    if(closed)return;
    var me;
    try{me=ws=new WebSocket(url,'mqtt');}catch(e){retry();return;}
    ws.binaryType='arraybuffer';buf=new Uint8Array(0);
    ws.onopen=function(){send(pkt(0x10,cat(cat(s2b('MQTT'),new Uint8Array([4,2,0,30])),s2b(cid))));};
    ws.onmessage=function(ev){buf=cat(buf,new Uint8Array(ev.data));parse();};
    ws.onclose=function(){if(me!==ws)return;var was=up;up=false;clearInterval(pingT);if(was)emit('down');else emit('fail');retry();};
    ws.onerror=function(){};
  }
  function retry(){if(closed)return;clearTimeout(rcT);rcT=setTimeout(connect,wait);wait=Math.min(wait*1.6,10000);}
  function parse(){
    while(buf.length>=2){
      var i=1,m=1,len=0,b;
      do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*m;m*=128;}while(b&128);
      if(buf.length<i+len)return;
      var h=buf[0],body=buf.subarray(i,i+len);buf=buf.subarray(i+len);
      var t=h>>4;
      if(t===2){
        if(body[1]===0){up=true;wait=1500;subs.forEach(dosub);clearInterval(pingT);pingT=setInterval(function(){send(new Uint8Array([0xC0,0]));},15000);emit('up');}
        else emit('refused');
      }else if(t===3){
        var tl=(body[0]<<8)|body[1],topic=dec.decode(body.subarray(2,2+tl)),o=2+tl;
        if(((h>>1)&3)>0)o+=2;
        if(opt.onMsg)opt.onMsg(topic,dec.decode(body.subarray(o)));
      }
    }
  }
  function dosub(t){pid=(pid%65535)+1;send(pkt(0x82,cat(new Uint8Array([pid>>8,pid&255]),cat(s2b(t),new Uint8Array([0])))));}
  var api={
    sub:function(t){if(subs.indexOf(t)<0)subs.push(t);if(up)dosub(t);},
    pub:function(t,p,retain){if(!up)return false;send(pkt(0x30|(retain?1:0),cat(s2b(t),enc.encode(p))));return true;},
    close:function(){closed=true;clearInterval(pingT);clearTimeout(rcT);try{ws.close();}catch(e){}},
    isUp:function(){return up;},url:url
  };
  connect();return api;
}


var P=new URLSearchParams(location.search),ROOM=P.get('r')||'';
var TOP='edt/ec1/s25/'+ROOM;
var BRK=P.get('broker')?[P.get('broker')]:['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var dev=lsGet('edt_dev')||('d'+Math.random().toString(36).slice(2,10));lsSet('edt_dev',dev);
var team=lsGet('s25team_'+ROOM);team=(team===null||team===undefined)?null:+team;
var NOM=lsGet('edt_nombre')||'',APE=lsGet('edt_apellido')||'';
var wv=0,ST=null,lastSeq=0,lastSig='',cli=null,bi=0,gotState=false,swT=null,lastTs=0,sel={},bet={},sendT={};
function ansKey(sid){return 's25a_'+ROOM+'_'+sid;}
function myAns(sid){var v=lsGet(ansKey(sid));if(!v)return null;try{return JSON.parse(v);}catch(e){return null;}}
function setStatus(){
  var up=cli&&cli.isUp(),fresh=Date.now()-lastTs<40000;
  $('#dot').className='dot '+(up?(fresh?'ok':''):'bad');
  $('#st').textContent=!up?'Conectando…':(fresh?'En vivo · profe conectada':'Conectado · esperando a la profe');
  var t=ST&&team!==null?ST.teams.filter(function(x){return x.id===team;})[0]:null;
  $('#who').innerHTML=t?('<b>'+esc(t.n)+'</b>'):'';
}
function send(o){o.r=ROOM;o.d=dev;o.tm=team;o.nom=NOM;o.ape=APE;return cli&&cli.pub(TOP+'/up',JSON.stringify(o),false);}
function presence(){if(team!==null&&NOM)send({t:'p'});}
setInterval(presence,15000);
function connect(){
  if(cli){try{cli.close();}catch(e){}}
  gotState=false;
  var url=BRK[bi%BRK.length];
  cli=MQ(url,{cid:'a'+dev,
    onMsg:function(tp,tx){if(tp!==TOP+'/state')return;var o;try{o=JSON.parse(tx);}catch(e){return;}if(!o||o.r!==ROOM)return;if(o.seq<lastSeq)return;lastSeq=o.seq;lastTs=o.ts||Date.now();gotState=true;clearTimeout(swT);ST=o;draw();setStatus();},
    onState:function(s,api){
      if(s==='up'){api.sub(TOP+'/state');presence();clearTimeout(swT);swT=setTimeout(function(){if(!gotState){bi++;connect();}},6000);}
      if(s==='fail'||s==='refused'){clearTimeout(swT);swT=setTimeout(function(){bi++;connect();},2500);}
      setStatus();
    }});
}
function pickTeam(id){team=id;lsSet('s25team_'+ROOM,String(id));lastSig='';draw();presence();setStatus();}
function changeTeam(){team=null;try{localStorage.removeItem('s25team_'+ROOM);}catch(e){}lastSig='';draw();}
function tname(id){var t=ST.teams.filter(function(x){return x.id===id;})[0];return t?t.n:'—';}
function tcol(id){var t=ST.teams.filter(function(x){return x.id===id;})[0];return t?t.c:'#888';}
function lab(i){return (ST.l&&ST.l[i])?ST.l[i]:'ABCD'[i];}

function draw(){
  var m=$('#m');
  if(!ROOM){m.innerHTML='<div class="wait"><div class="big">🤔</div><h1>Falta el código de sala</h1><p class="sub">Escanea de nuevo el QR que está en la pantalla.</p></div>';return;}
  if(!NOM||!APE){
    if($('#nmf'))return;
    m.innerHTML='<div class="kick">Paso 1</div><h1>¿Cómo te llamas?</h1><p class="sub">Escribe tu nombre y tu apellido. Solo se pide una vez; la profe lo usa para registrar tu participación.</p><div id="nmf"><input id="n1" placeholder="Nombre" autocomplete="given-name" maxlength="30"><input id="n2" placeholder="Apellido" autocomplete="family-name" maxlength="30"><p class="sent" id="nme"></p><button class="go" data-nm="1">Continuar</button></div>';
    return;
  }
  if(!ST){m.innerHTML='<div class="wait"><div class="ring"></div><h1>Conectando con la clase…</h1><p class="sub">Si tarda, revisa que tengas internet. La profesora debe tener encendido el modo En vivo.</p></div>';return;}
  if(team===null||!ST.teams.some(function(t){return t.id===team;})){
    team=null;
    m.innerHTML='<div class="kick">Paso 2</div><h1>¿De qué equipo eres?</h1><p class="sub">Elige tu equipo. Solo se hace una vez.</p><div class="teams">'
      +ST.teams.map(function(t){return '<button class="tm" style="--c:'+esc(t.c)+'" data-t="'+t.id+'">'+esc(t.n)+'</button>';}).join('')+'</div>';
    return;
  }
  var sid=ST.k==='s'?('robo-'+ST.aid):ST.sid,mine=myAns(sid);
  if(document.activeElement&&document.activeElement.id==='wtx')return;
  var sig=JSON.stringify([wv,ST.ph,ST.ents&&ST.ents.length,ST.ne,ST.sid,ST.k,ST.rev,ST.c,ST.st,ST.n,ST.lk,ST.bz,ST.w,ST.sst,ST.aid,ST.stt,ST.teams,team,sel[sid],bet[sid],mine,ST.sc&&ST.sc[team]]);
  if(sig===lastSig)return;lastSig=sig;
  var h='<div class="bar"><div class="me" style="--c:'+esc(tcol(team))+'">'+esc(tname(team))+'<a data-ch="1">cambiar</a></div><span class="sub" style="margin:0">⭐ '+(ST.sc?ST.sc[team]:0)+' pts</span></div>';
  if(ST.k==='v'||ST.k==='b')h+=drawQ(sid,mine);
  else if(ST.k==='t')h+=drawTv(sid,mine);
  else if(ST.k==='w')h+=drawWall();
  else if(ST.k==='z')h+=drawBuzz();
  else if(ST.k==='s')h+=drawSteal(sid,mine);
  else h+='<div class="wait"><div class="big">🎬</div><h1>'+esc(ST.ti)+'</h1><p class="sub">Mira la pantalla del salón. Cuando haya una pregunta, aparecerá aquí.</p></div>';
  m.innerHTML=h;
}
function drawQ(sid,mine){
  var bt=ST.k==='b',h='<div class="kick">'+(bt?'🎰 Apuesta':'Pregunta')+'</div>';
  if(ST.cs)h+='<div class="case">'+esc(ST.cs)+'</div>';
  h+='<div class="qq">'+esc(ST.q)+'</div>';
  var locked=!!mine,c=ST.c;
  h+=ST.o.map(function(tx,i){
    var cls='op';
    if(locked){ if(mine.i===i)cls+=' on'; if(ST.rev&&c!=null){ if(c===i)cls+=' ok'; else if(mine.i===i)cls+=' bad'; else cls+=' no'; } }
    else if(sel[sid]===i)cls+=' on';
    return '<button class="'+cls+'" data-o="'+i+'"'+(locked?' disabled':'')+'><b>'+esc(lab(i))+'</b><span>'+esc(tx)+'</span></button>';
  }).join('');
  if(bt&&!locked){h+='<div class="sub" style="margin:8px 0 4px">¿Cuánto apuestas?</div><div class="bets">'+[1,2,3].map(function(n){return '<button data-b="'+n+'" class="'+((bet[sid]||1)===n?'on':'')+'">×'+n+'</button>';}).join('')+'</div>';}
  if(!locked){
    if(ST.rev)return h+'<div class="res neu">⏱ Esta pregunta ya se cerró.</div>';
    h+='<button class="go" data-send="1"'+(sel[sid]==null?' disabled':'')+'>Enviar respuesta</button><div class="sent">Solo puedes responder una vez.</div>';
  }else{
    if(ST.rev&&c!=null)h+='<div class="res '+(mine.i===c?'':'bad')+'">'+(mine.i===c?'✔ ¡Acertaste!':'✖ No esta vez')+'</div>';
    else if(ST.rev)h+='<div class="res neu">Mira los resultados en la pantalla.</div>';
    else h+='<div class="res neu">✔ Respuesta enviada'+(bt?' (apuesta ×'+(mine.b||1)+')':'')+'. Espera a que la profe revele.</div>';
  }
  return h;
}
function drawTv(sid,mine){
  var h='<div class="kick">🏆 Vota</div><h1>'+esc(ST.q)+'</h1><p class="sub">Elige el equipo que más te enganchó. No puedes votar por el tuyo.</p>';
  if(mine){return h+'<div class="res neu">✔ Voto enviado: '+esc(tname(mine.i))+'.</div>'+(ST.rev?'<p class="sub" style="margin-top:10px">Mira el resultado en la pantalla.</p>':'');}
  if(ST.rev)return h+'<div class="res neu">⏱ La votación ya se cerró.</div>';
  h+='<div class="teams">'+ST.teams.map(function(t){return '<button class="tm" style="--c:'+esc(t.c)+'" data-v="'+t.id+'"'+(t.id===team?' disabled':'')+'>'+esc(t.n)+'</button>';}).join('')+'</div>';
  return h;
}
var RXE=['🔥','👏','💡','🤯'],RXL=['Convence','Claro','Original','Dato wow'];
function wKey(sid){return 's25x_'+ROOM+'_'+sid;}
function rKey(sid,i){return 's25r_'+ROOM+'_'+sid+'_'+i;}
function drawWall(){
  var sid=ST.sid,h='<div class="kick">🧱 Muro de ejemplos</div><p class="sub">'+esc(ST.q)+'</p>',mine=lsGet(wKey(sid));
  if(ST.ph==='write'){
    if(mine)return h+'<div class="res neu">✔ Enviaste: “'+esc(mine)+'”<br>Mira la pantalla del salón.</div>';
    if(ST.rev)return h+'<div class="res neu">⏱ Ya se cerró esta ronda.</div>';
    if(ST.ne&&ST.ne[team]>=2)return h+'<div class="res neu">Tu equipo ya envió 2 ejemplos.</div>';
    return h+'<textarea id="wtx" maxlength="160" rows="4" placeholder="Escribe 1 frase con el problema, para quién y un dato o beneficio"></textarea><button class="go" data-wx="1">Enviar ejemplo de mi equipo</button><div class="sent">Máx. 160 caracteres · un ejemplo por persona · 2 por equipo.</div>';
  }
  h+='<p class="sub">Reacciona a los ejemplos de <b>otros</b> equipos (una vez por ejemplo).</p>';
  (ST.ents||[]).forEach(function(e,i){
    var own=e.tm===team,r=lsGet(rKey(sid,i)),t=tname(e.tm);
    h+='<div class="wcard" style="--c:'+esc(tcol(e.tm))+'"><b>'+esc(t)+'</b><span>'+esc(e.t)+'</span>';
    if(own)h+='<em>Es de tu equipo: no puedes reaccionar.</em>';
    else h+='<div class="rxrow">'+RXE.map(function(x,k){return '<button class="rx'+(r!==null&&+r===k?' on':'')+'" data-rk="'+i+'|'+k+'"'+((r!==null||ST.rev)?' disabled':'')+'>'+x+'<small>'+RXL[k]+'</small></button>';}).join('')+'</div>';
    h+='</div>';
  });
  if(ST.rev)h+='<div class="res neu">Mira los resultados en la pantalla.</div>';
  return h;
}
function drawBuzz(){
  var h='<div class="kick">🔔 Buzzer</div><h1>'+esc(ST.ti)+'</h1>';
  var locked=(ST.lk||[]).indexOf(team)>-1;
  if(ST.st==='idle')return h+'<div class="wait"><div class="big">⏳</div><p class="sub">Prepárate: la profe va a arrancar la ronda.</p></div>';
  if(ST.st==='run')return h+'<p class="sub">Toca cuando sepas la respuesta. ¡El primero de la clase frena la ronda por su equipo!</p><button class="bz" data-z="1"'+(locked?' disabled':'')+'>'+(locked?'BLOQUEADO':'¡YO!')+'</button>';
  if(ST.st==='buzz')return h+'<div class="res neu">🔔 '+(ST.bz===team?'¡Frenaste la ronda por tu equipo!':esc(tname(ST.bz))+' frenó la ronda.')+'</div>';
  return h+'<div class="res '+(ST.w===team?'':'neu')+'">'+(ST.w===team?'✔ ¡Punto para tu equipo!':(ST.w?esc(tname(ST.w))+' se llevó el punto.':'Nadie acertó.'))+'</div>';
}
function drawSteal(sid,mine){
  var h='<div class="kick">🏴‍☠️ Robo</div><h1>'+esc(tname(ST.stt))+' intenta robarle '+ST.stn+' pt'+(ST.stn>1?'s':'')+' a '+esc(tname(ST.stv))+'</h1>';
  if(ST.stt!==team)return h+'<div class="res neu">Solo responde el equipo que roba. Mira la pantalla.</div>';
  h+='<div class="qq">'+esc(ST.q)+'</div>';
  var locked=!!mine,c=ST.c;
  h+=ST.o.map(function(tx,i){
    var cls='op';
    if(locked){if(mine.i===i)cls+=' on';if(ST.sst==='done'&&c!=null){if(c===i)cls+=' ok';else if(mine.i===i)cls+=' bad';else cls+=' no';}}
    else if(sel[sid]===i)cls+=' on';
    return '<button class="'+cls+'" data-o="'+i+'"'+(locked?' disabled':'')+'><b>'+'ABC'[i]+'</b><span>'+esc(tx)+'</span></button>';
  }).join('');
  if(!locked){
    if(ST.sst==='done')return h+'<div class="res neu">⏱ La ronda ya se cerró.</div>';
    h+='<button class="go" data-send="1"'+(sel[sid]==null?' disabled':'')+'>Enviar respuesta</button><div class="sent">Se toma la letra más votada de tu equipo (empate = falla).</div>';
  }else h+='<div class="res neu">✔ Respuesta enviada. Se toma la letra más votada de tu equipo.</div>';
  return h;
}
$('#m').addEventListener('click',function(e){
  var b;
  if(e.target.closest('[data-nm]')){var a1=$('#n1').value.trim(),a2=$('#n2').value.trim();if(a1.length<2||a2.length<2){$('#nme').style.color='#ff9a9a';$('#nme').textContent='Escribe nombre y apellido.';return;}lsSet('edt_nombre',a1);lsSet('edt_apellido',a2);NOM=a1;APE=a2;lastSig='';draw();presence();return;}
  if((b=e.target.closest('[data-t]'))){pickTeam(+b.dataset.t);return;}
  if(e.target.closest('[data-ch]')){changeTeam();return;}
  if(!ST)return;
  var sid=ST.k==='s'?('robo-'+ST.aid):ST.sid;
  if((b=e.target.closest('[data-o]'))){if(myAns(sid))return;sel[sid]=+b.dataset.o;lastSig='';draw();return;}
  if((b=e.target.closest('[data-b]'))){bet[sid]=+b.dataset.b;lastSig='';draw();return;}
  var wb=e.target.closest('[data-wx]');
  if(wb&&ST&&ST.k==='w'){var tx=($('#wtx').value||'').replace(/\s+/g,' ').trim();if(tx.length<4)return;if(lsGet(wKey(ST.sid)))return;lsSet(wKey(ST.sid),tx);var ox={t:'x',sid:ST.sid,x:tx};send(ox);setTimeout(function(){send(ox);},1200);try{navigator.vibrate&&navigator.vibrate(30);}catch(x){}wv++;lastSig='';draw();return;}
  var rb=e.target.closest('[data-rk]');
  if(rb&&ST&&ST.k==='w'){var pr=rb.dataset.rk.split('|'),ei=+pr[0],kk=+pr[1];if(lsGet(rKey(ST.sid,ei))!==null)return;lsSet(rKey(ST.sid,ei),String(kk));var orx={t:'r',sid:ST.sid,e:ei,k:kk};send(orx);setTimeout(function(){send(orx);},1200);try{navigator.vibrate&&navigator.vibrate(20);}catch(x){}wv++;lastSig='';draw();return;}
  if(e.target.closest('[data-send]')){
    if(myAns(sid)||sel[sid]==null)return;
    var o=ST.k==='s'?{t:'s',sid:'robo',aid:ST.aid,i:sel[sid]}:{t:'v',sid:ST.sid,i:sel[sid],b:ST.k==='b'?(bet[sid]||1):0};
    send(o);var rec={i:sel[sid],b:o.b||0};lsSet(ansKey(sid),JSON.stringify(rec));
    /* reenvío por si se pierde el primer paquete: el anfitrión ignora duplicados */
    setTimeout(function(){send(o);},1200);
    try{navigator.vibrate&&navigator.vibrate(30);}catch(x){}
    lastSig='';draw();return;}
  if((b=e.target.closest('[data-v]'))){
    if(myAns(sid))return;var tid=+b.dataset.v;if(tid===team)return;
    var o2={t:'v',sid:ST.sid,i:tid};send(o2);lsSet(ansKey(sid),JSON.stringify({i:tid,b:0}));setTimeout(function(){send(o2);},1200);
    try{navigator.vibrate&&navigator.vibrate(30);}catch(x){}
    lastSig='';draw();return;}
  if(e.target.closest('[data-z]')){send({t:'z',sid:ST.sid});try{navigator.vibrate&&navigator.vibrate(60);}catch(x){}return;}
});
draw();connect();
})();
</script></body></html>
