<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sesión 25 · El Pitch — Presentación de clase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fc; --bg2:#e9eff9; --card:#ffffff; --card2:#e3ebfa; --ink:#0f1b33; --mut:#53627f;
  --or:#2b3df0; --am:#d9480f; --mint:#12a150; --pk:#e11d48; --cy:#0891b2; --vi:#6d28d9; --red:#dc2626;
  --font:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;--serif:'Space Grotesk','Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#d9e2f1;color:var(--ink);font-family:var(--font);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#stage{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:radial-gradient(1000px 640px at 78% -8%,#cfe0ff 0%,transparent 62%),radial-gradient(900px 600px at 0% 108%,#ffe9c7 0%,transparent 60%),var(--bg);
  border-radius:6px}
#cv::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(43,61,240,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(43,61,240,.05) 1px,transparent 1px);background-size:64px 64px;pointer-events:none}
#sl{position:absolute;inset:0;padding:64px 96px 70px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.kick{font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--or)}
.tm{font-size:24px;color:var(--mut);background:rgba(15,27,51,.06);padding:6px 18px;border-radius:99px}
h1{font-size:150px;line-height:1;font-weight:800;letter-spacing:-.03em}
h2{font-size:70px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin-bottom:26px}
h2 em,h1 span{font-style:normal;color:var(--or)}
h3{font-size:38px;font-weight:700;margin-bottom:10px}
p,li{font-size:38px;line-height:1.35;color:#1f2d4a}
.sm{font-size:28px;color:var(--mut)}
.mut{color:var(--mut)}
b,strong{color:#0f1b33}
.hl{color:var(--am)}
.grid{display:grid;gap:28px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.card{background:var(--card);border-radius:28px;padding:34px 36px;border:2px solid rgba(15,27,51,.06);position:relative}
.card .ic{font-size:70px;line-height:1;margin-bottom:14px;display:block}
.card p{font-size:32px}
.card h3{font-size:36px}
.num{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--or);color:#0f1b33;font-weight:800;font-size:34px;margin-bottom:14px}
.btn{background:var(--or);color:#0f1b33;font-weight:700;font-size:28px;padding:16px 30px;border-radius:99px;box-shadow:0 8px 24px rgba(43,61,240,.35);transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:var(--card2);box-shadow:none}
.btn.mint{background:var(--mint);color:#06281c;box-shadow:0 8px 24px rgba(123,211,137,.3)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.callout{background:linear-gradient(90deg,rgba(217,72,15,.16),rgba(217,72,15,.04));border-left:8px solid var(--am);border-radius:18px;padding:22px 30px;font-size:34px;margin-top:26px}
.callout.or{background:linear-gradient(90deg,rgba(43,61,240,.2),rgba(43,61,240,.04));border-color:var(--or)}
.callout.mint{background:linear-gradient(90deg,rgba(123,211,137,.18),rgba(123,211,137,.04));border-color:var(--mint)}
.rv{opacity:0;transform:translateY(22px);transition:.4s;pointer-events:none}
.rv.on{opacity:1;transform:none;pointer-events:auto}
/* chips */
.chip{--c:#0f1b33;display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--c) 22%,#ffffff);border:3px solid var(--c);color:#0f1b33;font-weight:700;font-size:25px;padding:6px 18px;border-radius:99px;white-space:nowrap;line-height:1.2}
button.chip:hover{filter:brightness(1.25)}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--c);display:inline-block}
/* cover */
.cover{height:100%;display:flex;flex-direction:column;justify-content:center;position:relative}
.cover .eyebrow{font-size:30px;font-weight:700;letter-spacing:.16em;color:var(--am);text-transform:uppercase;margin-bottom:12px}
.cover .sub{font-size:52px;font-weight:700;margin-top:18px;color:#0f1b33}
.cover .tag{font-size:36px;color:var(--mut);margin:10px 0 36px}
.cover .rules{display:flex;gap:18px;margin-bottom:30px}
.cover .rules div{background:var(--card);border-radius:20px;padding:16px 24px;font-size:27px;border:2px solid rgba(15,27,51,.07)}
.blob{position:absolute;right:-40px;top:40px;font-size:340px;opacity:.9;filter:drop-shadow(0 30px 60px rgba(43,61,240,.35));transform:rotate(-10deg)}
.blob2{position:absolute;right:120px;bottom:110px;font-size:150px;transform:rotate(14deg)}
/* vote */
.opts{display:grid;gap:12px;margin-top:4px}
.opt{display:grid;grid-template-columns:70px 1fr auto 56px;align-items:center;gap:20px;background:var(--card);border:3px solid rgba(15,27,51,.07);border-radius:22px;padding:8px 26px;min-height:84px;position:relative;overflow:hidden}
.opt .L{font-size:40px;font-weight:800;color:var(--am)}
.opt .tx{font-size:32px;line-height:1.15}
.opt .vc{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:760px}
.opt .cnt{font-size:36px;font-weight:800;text-align:right;color:var(--mut)}
.opt .bar{position:absolute;left:0;bottom:0;height:7px;background:var(--cy);transition:.4s}
.opt.ok{border-color:var(--mint);background:rgba(123,211,137,.13)}
.opt.ok .L{color:var(--mint)}
.opt.no{opacity:.45}
.tray{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:56px}
.tray .lbl{font-size:24px;color:var(--mut);margin-right:6px}
.hint{font-size:22px;color:var(--mut)}
.expl{margin-top:14px;font-size:30px;background:rgba(123,211,137,.12);border-left:8px solid var(--mint);padding:18px 26px;border-radius:16px}
.q{font-size:50px;line-height:1.12;font-weight:800;margin-bottom:16px}
.q.s{font-size:46px}
.case{font-size:34px;background:var(--card2);border-radius:20px;padding:14px 28px;margin-bottom:14px;border:2px dashed rgba(15,27,51,.18)}
/* flip */
.flip{perspective:1200px;height:520px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;padding:34px;display:flex;flex-direction:column;justify-content:center;border:2px solid rgba(15,27,51,.08)}
.flip .fa{background:var(--card);align-items:center;text-align:center}
.flip .fa .ic{font-size:120px;margin-bottom:16px}
.flip .fa h3{font-size:44px}
.flip .fa small{font-size:24px;color:var(--mut);margin-top:12px}
.flip .fb{background:linear-gradient(160deg,#2f2147,#eef2fa);transform:rotateY(180deg)}
.flip .fb p{font-size:28px;margin-bottom:12px}
.flip .fb b{color:var(--am)}
/* steps ladder */
.stairs{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;align-items:end;height:620px}
.stair{background:var(--card);border-radius:28px;padding:30px;border:2px solid rgba(15,27,51,.07);display:flex;flex-direction:column;justify-content:flex-start}
.stair:nth-child(1){height:60%;border-top:10px solid var(--mint)}
.stair:nth-child(2){height:80%;border-top:10px solid var(--am)}
.stair:nth-child(3){height:100%;border-top:10px solid var(--pk)}
.stair h3{font-size:44px}.stair p{font-size:29px}
.tag2{display:inline-block;background:var(--or);color:#0f1b33;font-weight:700;font-size:24px;border-radius:99px;padding:4px 16px;margin-bottom:10px}
/* timeline */
.tl{display:flex;flex-direction:column;gap:16px}
.tl .st{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;background:var(--card);border-radius:22px;padding:16px 26px;border:2px solid rgba(15,27,51,.06)}
.tl .st .yr{font-size:34px;font-weight:800;color:var(--or)}
.tl .st p{font-size:31px}
/* quadrants */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.quad .card{min-height:250px}
.quad h3{font-size:44px}
.quad .card p{font-size:29px}
/* clues */
.clue{background:var(--card);border-radius:22px;padding:20px 30px;font-size:38px;margin-bottom:14px;display:flex;gap:20px;align-items:center;border:2px solid rgba(15,27,51,.07)}
.clue .pt{font-weight:800;color:var(--am);font-size:30px;min-width:100px}
.answer{font-size:72px;font-weight:800;color:var(--mint);margin:16px 0}
/* podium */
.pod{display:flex;gap:30px;align-items:flex-end;justify-content:center;height:560px}
.pod .col{width:420px;text-align:center}
.pod .blk{border-radius:26px 26px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:22px;font-size:90px;font-weight:800}
.pod .nm{font-size:40px;font-weight:700;margin-bottom:10px}
.pod .pt{font-size:36px;color:var(--am);font-weight:700;margin-bottom:8px}
.confetti{position:absolute;top:-60px;font-size:44px;animation:fall 5s linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(1200px) rotate(360deg)}}
/* floating UI */
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(14,16,22,.92);border:1px solid rgba(15,27,51,.14);padding:6px 10px;border-radius:99px;z-index:50;opacity:.55;transition:.2s;backdrop-filter:blur(6px)}
#bar:hover{opacity:1}
#bar button{background:transparent;font-size:15px;font-weight:600;padding:8px 12px;border-radius:99px;color:#22304f;white-space:nowrap}
#bar button:hover{background:rgba(15,27,51,.12)}
#bar .ct{font-size:15px;color:#aab;padding:0 8px;min-width:64px;text-align:center}
#prog{position:fixed;left:0;top:0;height:4px;background:var(--or);z-index:60;transition:.3s}
.panel{position:fixed;z-index:70;background:#f1f5fb;border:1px solid rgba(15,27,51,.16);border-radius:20px;color:#0f1b33;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#score{top:14px;right:14px;width:430px;max-height:calc(100vh - 90px);overflow:auto;padding:18px;display:none}
#score h4,#modal h4,#goto h4{font-size:20px;margin-bottom:10px}
.sr{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(15,27,51,.08);font-size:15px}
.sr .pts{font-weight:800;font-size:22px;color:var(--am);min-width:40px;text-align:right}
.sr .adj{grid-column:2/4;display:flex;gap:5px;flex-wrap:wrap}
.sr .adj button,.mini{background:#e6ecf7;font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px}
.sr .adj button:hover,.mini:hover{background:#c9d4ea}
.log{font-size:12px;color:#9aa;margin-top:10px;line-height:1.5}
#modal{top:50%;left:50%;transform:translate(-50%,-50%);width:640px;max-height:84vh;overflow:auto;padding:24px;display:none}
.tr{display:grid;grid-template-columns:24px 1fr 34px;gap:10px;align-items:center;margin-bottom:8px}
.tr input{background:#ffffff;border:1px solid #3a4152;border-radius:10px;color:#0f1b33;padding:8px 12px;font:600 16px var(--font);width:100%}
.tr .dot{width:22px;height:22px;border-radius:50%}
#goto{top:50%;left:50%;transform:translate(-50%,-50%);width:1000px;max-width:94vw;max-height:86vh;overflow:auto;padding:22px;display:none}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.gg button{background:#eef2fa;text-align:left;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.25}
.gg button small{display:block;color:var(--am);font-weight:600;font-size:12px;margin-bottom:2px}
.gg button.cur{outline:2px solid var(--or)}
.gg button:hover{background:#e6ecf7}
#notes{left:50%;bottom:62px;transform:translateX(-50%);width:min(1100px,92vw);padding:18px 24px;display:none;font-size:17px;line-height:1.5;max-height:42vh;overflow:auto}
#notes b{color:var(--am)}
#timer{top:14px;left:14px;padding:10px 16px;display:none;align-items:center;gap:12px}
#timer .tt{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;min-width:150px}
#timer.end{background:#dc2626;animation:fl .5s 6}
@keyframes fl{50%{background:#dc2626}}
#timer button{background:#e6ecf7;padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px}
#rand{inset:0;border-radius:0;display:none;place-items:center;background:rgba(6,7,10,.9)}
#rand .box{text-align:center}
#rand .big{font-size:110px;font-weight:800;margin:20px 0;min-width:900px}
#rand .st{font-size:28px;color:var(--mut)}
.help{font-size:13px;color:#8d96ab;margin-top:12px;line-height:1.6}
kbd{background:#e6ecf7;border-radius:6px;padding:1px 7px;font-size:12px}
.fb{display:flex}

/* ---- Arena / juego ---- */
#cv.game{background:radial-gradient(1100px 650px at 90% -10%,#6a1626 0%,transparent 60%),radial-gradient(900px 600px at -5% 105%,#eef2ff 0%,transparent 60%),#0b0608}
.game .kick{color:var(--cy)}
.gbanner{display:flex;align-items:center;gap:22px;margin-bottom:10px}
.gb1{font-weight:800;font-size:24px;letter-spacing:.12em;color:#0d0f1a;background:var(--am);padding:6px 18px;border-radius:10px}
.gbanner b{font-size:34px;font-weight:800;color:#0f1b33;letter-spacing:.04em}
.gb2{font-size:24px;color:var(--mut)}
.gtitle{font-size:56px;font-weight:800;line-height:1.1;margin:4px 0 14px}
.gtitle em{font-style:normal;color:var(--cy)}
.cover .rules{max-width:1380px;flex-wrap:wrap}
.qrbox{position:absolute;right:0;bottom:40px;width:250px;background:#fff;border-radius:22px;padding:14px;text-align:center;color:#111;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:3}
.qrbox svg{width:100%;height:auto;display:block}
.qrbox b{display:block;color:#111;font-size:26px;margin-top:6px}
.qrbox span{display:block;color:#444;font-size:19px;line-height:1.2}
.qrbox.lv{right:290px}
#live{inset:0;border-radius:0;display:none;background:rgba(6,7,10,.96);padding:60px;overflow:auto}
.lvwrap{display:flex;gap:60px;align-items:center;justify-content:center;min-height:100%}
.lvqr{width:560px;max-width:42vw;background:#fff;border-radius:28px;padding:20px;flex:none}.lvqr svg{width:100%;height:auto;display:block}
.lvinfo{max-width:760px}.lvinfo h4{font-size:34px;margin-bottom:10px}
.lvbig{font-size:54px;font-weight:800;line-height:1.1;margin:8px 0 16px}
.lvurl{font-size:15px;color:var(--mut);word-break:break-all}
.lvst{font-size:22px;margin:16px 0}
.lvteams{display:flex;flex-wrap:wrap;gap:8px}
.lvhelp{font-size:15px;color:var(--mut);margin-top:18px;line-height:1.45}
#bar button.liveon{background:#d9f5e6;color:#2ee6a6}
.tl4 .card p{font-size:26px}.tl4 .card h3{font-size:32px}.tl4 .card{padding:24px 26px}
.strip{position:absolute;left:96px;right:96px;bottom:62px;display:flex;gap:10px;flex-wrap:wrap}
.sc{flex:1;min-width:150px;background:rgba(15,27,51,.07);border-radius:14px;padding:6px 12px 10px;border-left:6px solid var(--c);position:relative;overflow:hidden}
.sc .n{font-size:18px;color:#22304f;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{font-size:34px;line-height:1.05;display:block}
.sc i{position:absolute;left:0;bottom:0;height:6px;background:var(--c);transition:width .8s}
.sc.bump{animation:bump 1s;box-shadow:0 0 0 3px var(--mint)}
.sc.drop{animation:shk .6s;box-shadow:0 0 0 3px var(--red)}
@keyframes bump{30%{transform:scale(1.12)}}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}}
.clue.lock{opacity:.4}
.cbar{height:16px;background:rgba(15,27,51,.1);border-radius:99px;overflow:hidden;margin:8px 0 12px}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--am),var(--red));transition:width .25s linear}
.buzzed{font-size:44px;font-weight:800;margin:8px 0 12px;animation:pin .4s}
.chip.locked{opacity:.5;text-decoration:line-through}
.btn.big{font-size:34px;padding:20px 44px}
.btn.red{background:var(--red);box-shadow:0 8px 24px rgba(255,93,93,.35)}
.pop-in{animation:pin .5s}
@keyframes pin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.obox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.ob{background:rgba(15,27,51,.07);border-radius:14px;padding:8px 18px;font-size:27px;line-height:1.2}
.ob b{color:var(--am);margin-right:8px}
.ob.ok{background:rgba(123,211,137,.2);outline:3px solid var(--mint)}.ob.no{opacity:.45}
.bt{display:flex;flex-direction:column;gap:6px}
.br{display:flex;align-items:center;gap:8px;background:rgba(15,27,51,.05);border-radius:14px;padding:5px 10px}
.br .chip{min-width:190px;font-size:20px}
.cell{width:56px;height:48px;border-radius:12px;background:#e6ecf7;font-size:24px;font-weight:800;color:#22304f}
.cell:hover{background:#c9d4ea}
.cell.sel{background:var(--cy);color:#06222b}
.cell.ok{outline:4px solid var(--mint)}
.cell.bad{background:var(--red);color:#0f1b33}
.bb{margin-left:auto;min-width:64px;height:48px;border-radius:12px;background:var(--am);color:#2b1f00;font-size:26px;font-weight:800}
.dice{font-size:150px;line-height:1;margin:6px 0}
.steal{font-size:38px;margin-top:14px;background:rgba(255,93,93,.15);border-left:8px solid var(--red);padding:14px 26px;border-radius:16px}
.card.glow{box-shadow:0 0 30px rgba(240,138,93,.18);border-color:rgba(240,138,93,.35)}
.pop{position:absolute;font-size:60px;pointer-events:none;z-index:40;animation:pp 1.6s ease-out forwards}
@keyframes pp{to{transform:translate(var(--dx),var(--dy)) rotate(40deg);opacity:0}}
#roster{inset:0;border-radius:0;display:none;background:#ffffff;padding:34px 44px;overflow:auto}
#roster h4{font-family:var(--serif);font-size:34px;margin:0 0 6px;color:var(--am)}
#roster .rsum{font-size:22px;color:var(--mut);margin:0 0 18px}#roster .rsum b{color:var(--ink)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.rcard{background:var(--card);border:1px solid rgba(15,27,51,.1);border-top:6px solid var(--c);border-radius:14px;padding:12px 16px}
.rcard h5{margin:0 0 8px;font-size:24px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rcard h5 span{font-size:20px;font-weight:800;white-space:nowrap}
.rcard ul{list-style:none;margin:0;padding:0}.rcard li{font-size:20px;padding:2px 0;display:flex;gap:8px;align-items:center}
.rcard li i{width:11px;height:11px;border-radius:50%;background:#8a94a8;flex:none}.rcard li.on i{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.rcard li.off{color:var(--mut)}.rcard .em{color:var(--mut);font-size:18px;font-style:italic}
#roster .rclose{position:fixed;top:20px;right:28px;z-index:2}
/* ===== Estética cine / cuentacuentos ===== */
.g2>div>.card p,.g2>.card p{font-size:36px}.g2>.card h3{font-size:42px}
.g3 .card p,.g4 .card p{font-size:34px}.g3 .card h3,.g4 .card h3{font-size:40px}
.tl4 .card p{font-size:32px!important}.tl4 .card h3{font-size:38px!important}
.callout{font-size:36px}
h1,h2,.gtitle,.q,.answer,.pod .nm,.tbig,.lvbig{font-family:var(--serif);font-optical-sizing:auto}
h1{font-weight:900;letter-spacing:-.025em;font-size:170px}
h2{font-weight:800;font-size:68px}
h2 em,h1 span,.gtitle em,.q em{font-style:italic;color:var(--or)}
.q{font-weight:700}
.btn{color:#0f1b33fff;box-shadow:0 8px 24px rgba(43,61,240,.3)}
.btn.alt{color:var(--ink);background:var(--card2)}

/* ---------- Pregunta (votación, encuesta o apuesta) ---------- */
function dist(sid,q){
  const n=q.opts.length,d=new Array(n).fill(0),a=answersOf(sid),man=S.votes[sid]||{};
  Object.keys(a).forEach(k=>{if(a[k].i>=0&&a[k].i<n)d[a[k].i]++;});
  S.teams.forEach(function(t){
    if(man[t.id]===undefined)return;
    if(Object.keys(a).some(k=>a[k].tm==t.id))return;
    if(man[t.id]>=0&&man[t.id]<n)d[man[t.id]]++;
  });
  return d;
}
function qSlide(o){
  const q={kind:o.kind||'vote',q:o.q,case:o.case||'',opts:o.opts,correct:(o.correct==null?null:o.correct),pts:o.pts||0,part:o.part||0,labels:o.labels||null,explain:o.explain||''};
  return {id:o.id,blk:o.blk,t:o.t,title:o.title||plain(o.q),notes:o.notes||'',q:q,game:!!o.game,
  html:function(s){
    const rev=!!S.rev[s.id],d=dist(s.id,q),tot=Math.max(1,d.reduce((a,b)=>a+b,0));
    const man=S.votes[s.id]||{},a=answersOf(s.id);

    h+='<div class="opts">'+q.opts.map(function(tx,i){
      let cls='';if(rev&&q.correct!=null)cls=(q.correct===i)?' ok':' no';
      const mans=S.teams.filter(t=>man[t.id]===i&&!Object.keys(a).some(k=>a[k].tm==t.id));
      return '<div class="opt'+cls+'"><span class="L">'+(q.labels?q.labels[i]:'ABCD'[i])+'</span><span class="tx">'+tx+'</span><span class="vc">'+(rev?'':mans.map(t=>chip(t,'cyc',s.id)).join(''))+'</span><span class="cnt">'+(rev?d[i]:'')+'</span><span class="bar" style="width:'+(rev?100*d[i]/tot:0)+'%"></span></div>';
    }).join('')+'</div>';
    const none=S.teams.filter(t=>man[t.id]===undefined&&!Object.keys(a).some(k=>a[k].tm==t.id));
    h+='<div class="tray">'+(rev?'<span class="lbl">'+tot+' respuesta'+(tot==1?'':'s')+' en total</span>':(answerChips(s.id)+((!LV.on||liveCount().tot===0)?'<span class="lbl" style="margin-left:14px">Sin celular · asigna a mano:</span>'+none.map(t=>chip(t,'cyc',s.id)).join(''):'')))+'</div>';

      (q.kind==='poll'?'Encuesta: cada respuesta suma +'+q.part+' de participación.':(q.kind==='bet'?'Acierto: +apuesta. Fallo: −apuesta (el equipo nunca baja de 0).':'Cada integrante responde una vez. Acierto: +'+q.pts+' para su equipo.'))+'</span></div>';
    if(rev&&q.explain)h+='<div class="expl">'+q.explain+'</div>';

  }};
}

function tickClue(){

/* ================= Render ================= */
function render(){
  const s=SL[S.idx];
  cv.classList.toggle('game',!!s.game);
  if(LV.on&&(s.q||s.tv||s.clue||s.wall)){S.launched[s.id]=plain(s.title);}
  sl.innerHTML='<div class="top"><span class="kick">🎤 Escena '+(S.idx+1)+' · '+s.blk+'</span><span class="tm">⏱ min '+s.t+'</span></div>'+s.html(s);
  $('#ct').textContent=(S.idx+1)+' / '+SL.length;
  $('#prog').style.width=((S.idx+1)/SL.length*100)+'%';
  if($('#notes').style.display==='block')showNotes();
  if($('#score').style.display==='block')renderScore();
  save();
  liveSync();
}
function go(i){S.idx=Math.max(0,Math.min(SL.length-1,i));render();}
function next(){go(S.idx+1);}

function applyReveal(sd){
  const sid=sd.id,q=sd.q,dv=answersOf(sid),man=S.votes[sid]||{},mb=S.bets[sid]||{};
  S.rev[sid]=true;S.res[sid]={};let any=false;
  function score(a,key,dev){
    let ok=null,p=0;
    if(q.kind==='vote'&&q.correct!=null){ok=a.i===q.correct;p=ok?q.pts:0;}
    else if(q.kind==='poll'){p=q.part||0;}
    else if(q.kind==='bet'){ok=a.i===q.correct;const b=a.b||1;p=ok?b:-Math.min(b,Math.max(0,pts(a.tm)));}
    if(p)addLog(a.tm,p,'q',sid,dev);
    if(ok)any=true;
    S.res[sid][key]={i:a.i,b:a.b||0,ok:ok,p:p,tm:a.tm};
  }
  Object.keys(dv).forEach(function(d){const a=dv[d];if(team(a.tm))score(a,d,d);});
  S.teams.forEach(function(t){
    if(man[t.id]===undefined||Object.keys(dv).some(k=>dv[k].tm==t.id))return;
    score({tm:t.id,i:man[t.id],b:mb[t.id]||1},'team'+t.id,null);
  });
  if(q.correct!=null){sfx(any?'ok':'no');if(any)burst();}else sfx('ok');
}
function undoReveal(sid){delete S.rev[sid];S.log=S.log.filter(l=>!(l.sid===sid&&l.why==='q'));delete S.res[sid];}
function resolveSteal(ok){
  const st=S.steal,sid='robo-'+st.aid,Q=STEAL_BANK[st.q],t=team(st.t),v=team(st.v);if(!t||!v)return;
  S.log=S.log.filter(l=>l.sid!==sid);
  let txt;
  if(ok){const take=Math.min(st.n,Math.max(0,pts(v.id)));if(take>0){addLog(v.id,-take,'robo',sid);addLog(t.id,take,'robo',sid);}
    txt='✔ '+esc(t.name)+' acertó y le robó <b>'+take+'</b> pt'+(take==1?'':'s')+' a '+esc(v.name);}
  else{const pay=Math.min(st.n,Math.max(0,pts(t.id)));if(pay>0){addLog(t.id,-pay,'robo',sid);addLog(v.id,pay,'robo',sid);}
    txt='✖ '+esc(t.name)+' falló y le pagó <b>'+pay+'</b> pt'+(pay==1?'':'s')+' a '+esc(v.name);}
  st.ok=ok;st.st='done';st.last=txt;
  S.res[sid]={};Object.keys(st.ans).forEach(function(d){S.res[sid][d]={i:st.ans[d].i,b:0,ok:st.ans[d].i===Q.c,p:0,tm:st.ans[d].tm};});
  if(st.hist.indexOf(sid)<0)st.hist.push(sid);
  sfx(ok?'win':'no');if(ok)burst(['🎬','💰','⭐']);
}

/* Cliente MQTT 3.1.1 mínimo sobre WebSocket (QoS 0). */
function MQ(url,opt){
  opt=opt||{};
  var enc=new TextEncoder(),dec=new TextDecoder();
  var ws=null,buf=new Uint8Array(0),pid=0,pingT=null,rcT=null,subs=[],up=false,closed=false,wait=1500;
  var cid=opt.cid||('c'+Math.random().toString(36).slice(2,10));
  function cat(a,b){var r=new Uint8Array(a.length+b.length);r.set(a,0);r.set(b,a.length);return r;}
  function s2b(s){var b=enc.encode(s),r=new Uint8Array(b.length+2);r[0]=b.length>>8;r[1]=b.length&255;r.set(b,2);return r;}
  function rl(n){var a=[];do{var d=n%128;n=Math.floor(n/128);if(n>0)d|=128;a.push(d);}while(n>0);return new Uint8Array(a);}
  function pkt(h,body){var l=rl(body.length),r=new Uint8Array(1+l.length+body.length);r[0]=h;r.set(l,1);r.set(body,1+l.length);return r;}
  function send(p){try{if(ws&&ws.readyState===1)ws.send(p);}catch(e){}}
  function emit(s){if(opt.onState)opt.onState(s,api);}
  function connect(){
    if(closed)return;
    var me;
    try{me=ws=new WebSocket(url,'mqtt');}catch(e){retry();return;}
    ws.binaryType='arraybuffer';buf=new Uint8Array(0);
    ws.onopen=function(){send(pkt(0x10,cat(cat(s2b('MQTT'),new Uint8Array([4,2,0,30])),s2b(cid))));};
    ws.onmessage=function(ev){buf=cat(buf,new Uint8Array(ev.data));parse();};
    ws.onclose=function(){if(me!==ws)return;var was=up;up=false;clearInterval(pingT);if(was)emit('down');else emit('fail');retry();};
    ws.onerror=function(){};
  }
  function retry(){if(closed)return;clearTimeout(rcT);rcT=setTimeout(connect,wait);wait=Math.min(wait*1.6,10000);}
  function parse(){
    while(buf.length>=2){
      var i=1,m=1,len=0,b;
      do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*m;m*=128;}while(b&128);
      if(buf.length<i+len)return;
      var h=buf[0],body=buf.subarray(i,i+len);buf=buf.subarray(i+len);
      var t=h>>4;
      if(t===2){
        if(body[1]===0){up=true;wait=1500;subs.forEach(dosub);clearInterval(pingT);pingT=setInterval(function(){send(new Uint8Array([0xC0,0]));},15000);emit('up');}
        else emit('refused');
      }else if(t===3){
        var tl=(body[0]<<8)|body[1],topic=dec.decode(body.subarray(2,2+tl)),o=2+tl;
        if(((h>>1)&3)>0)o+=2;
        if(opt.onMsg)opt.onMsg(topic,dec.decode(body.subarray(o)));
      }
    }
  }
  function dosub(t){pid=(pid%65535)+1;send(pkt(0x82,cat(new Uint8Array([pid>>8,pid&255]),cat(s2b(t),new Uint8Array([0])))));}
  var api={
    sub:function(t){if(subs.indexOf(t)<0)subs.push(t);if(up)dosub(t);},
    pub:function(t,p,retain){if(!up)return false;send(pkt(0x30|(retain?1:0),cat(s2b(t),enc.encode(p))));return true;},
    close:function(){closed=true;clearInterval(pingT);clearTimeout(rcT);try{ws.close();}catch(e){}},
    isUp:function(){return up;},url:url
  };
  connect();return api;
}

function ansCounts(sid){const o={};S.teams.forEach(t=>{o[t.id]=answeredOf(sid,t.id);});return o;}
function liveState(){
  const s=SL[S.idx],o={r:ROOM,sid:s.id,k:'i',ti:plain(s.title),teams:S.teams.map(t=>({id:t.id,n:t.name,c:col(t)})),sc:{}};
  S.teams.forEach(t=>{o.sc[t.id]=pts(t.id);});
  if(s.q){
    const q=s.q;o.k=q.kind==='bet'?'b':'v';o.q=plain(q.q);o.cs=plain(q.case||'');o.o=q.opts.map(plain);o.l=q.labels||null;
    o.rev=!!S.rev[s.id];if(o.rev&&q.correct!=null)o.c=q.correct;if(o.rev)o.d=dist(s.id,q);o.ans=ansCounts(s.id);
  }else if(s.tv){
    o.k='t';o.q=plain(s.title);o.rev=!!S.rev[s.id];if(o.rev)o.d=tvCounts(s.id);o.ans=ansCounts(s.id);
  }else if(s.wall){
    const E=wEntries(s.id),ne={};E.forEach(e=>{ne[e.tm]=(ne[e.tm]||0)+1;});
    o.k='w';o.q=plain(s.wall.sub);o.ph=S.wph[s.id]||'write';o.rev=!!S.rev[s.id];o.ents=E.map(e=>({tm:e.tm,t:e.txt}));o.ne=ne;
  }else if(s.clue){
    const c=S.clue[s.id]||{st:'idle',n:1,locked:[]};
    o.k='z';o.st=c.st;o.n=c.n||1;o.lk=c.locked||[];o.bz=c.buzz||null;o.w=c.w==null?null:c.w;
  }else if(s.id==='robo'&&(S.steal.st==='ask'||S.steal.st==='done')){
    const st=S.steal,Q=STEAL_BANK[st.q];
    o.k='s';o.sst=st.st;o.stt=st.t;o.stv=st.v;o.stn=st.n;o.aid=st.aid;o.q=Q.q;o.o=Q.o;if(st.st==='done')o.c=Q.c;
    o.nans=Object.keys(st.ans).length;
  }
  return o;
}

function onUp(txt){
  let m;try{m=JSON.parse(txt);}catch(e){return;}
  if(!m||m.r!==ROOM||!m.d||typeof m.d!=='string'||m.d.length>40)return;
  const tmOk=m.tm!=null&&team(m.tm);
  if(tmOk)LV.pres[m.d]={tm:+m.tm,ts:Date.now()};
  if(tmOk&&m.nom&&m.ape){
    const nom=String(m.nom).slice(0,30),ape=String(m.ape).slice(0,30),p=S.people[m.d];
    if(!p)S.people[m.d]={nom:nom,ape:ape,tm:+m.tm,first:Date.now()};else{p.nom=nom;p.ape=ape;p.tm=+m.tm;}
  }
  if($('#roster').style.display==='block')rosterDraw();
  if(m.t==='p'){liveBtn();if($('#live').style.display==='block')liveDraw();renderSoon();return;}
  const s=SL[S.idx];if(!s||m.sid!==s.id||!tmOk)return;
  if(m.t==='v'&&s.q){
    if(S.rev[s.id])return;
    const q=s.q;if(!(m.i>=0&&m.i<q.opts.length))return;
    const a=S.dv[s.id]||(S.dv[s.id]={});if(a[m.d])return;
    a[m.d]={tm:+m.tm,i:m.i|0,b:q.kind==='bet'?Math.min(3,Math.max(1,m.b|0||1)):0,ts:Date.now()};
    save();renderSoon();
  }else if(m.t==='v'&&s.tv){
    if(S.rev[s.id])return;
    if(!team(m.i)||+m.i===+m.tm)return;
    const a=S.dv[s.id]||(S.dv[s.id]={});if(a[m.d])return;
    a[m.d]={tm:+m.tm,i:+m.i,b:0,ts:Date.now()};save();renderSoon();
  }else if(m.t==='x'&&s.wall){
    if(S.rev[s.id]||(S.wph[s.id]||'write')!=='write')return;
    const txt=String(m.x||'').replace(/\s+/g,' ').trim().slice(0,160);if(txt.length<4)return;
    const a=S.wl[s.id]||(S.wl[s.id]={});if(a[m.d])return;
    if(Object.keys(a).filter(k=>a[k].tm==+m.tm).length>=2)return;
    a[m.d]={tm:+m.tm,txt:txt,ts:Date.now()};save();renderSoon();
  }else if(m.t==='r'&&s.wall){
    if(S.rev[s.id]||S.wph[s.id]!=='react')return;
    const E=wEntries(s.id),e=E[m.e|0];if(!e||e.tm==+m.tm)return;if(!(m.k>=0&&m.k<4))return;
    const r=S.wr[s.id]||(S.wr[s.id]={}),key=m.d+'>'+e.d;if(r[key]!==undefined)return;
    r[key]={k:m.k|0,tm:+m.tm};save();renderSoon();
  }else if(m.t==='z'&&s.clue){
    const c=cs(s.id);if(c.st!=='run'||c.locked.indexOf(+m.tm)>-1)return;
    ACT.cBuzz({dataset:{sid:s.id,team:+m.tm,dev:m.d}});
  }else if(m.t==='s'&&s.id==='robo'){
    const st=S.steal;if(st.st!=='ask'||+m.tm!==+st.t||m.aid!==st.aid)return;
    if(!(m.i>=0&&m.i<3)||st.ans[m.d])return;
    st.ans[m.d]={i:m.i|0,tm:+m.tm};save();renderSoon();
  }
}

function titleOf(sid){const s=SL.find(x=>x.id===sid);if(s)return plain(s.title);if(sid.indexOf('robo-')===0)return 'Robo '+sid.slice(5);return sid;}
function typeOf(sid){const s=SL.find(x=>x.id===sid);if(s){if(s.q)return {vote:'Votación',poll:'Encuesta',bet:'Apuesta'}[s.q.kind];if(s.tv)return 'Voto por equipo';if(s.wall)return 'Muro de ejemplos';if(s.clue)return 'Buzzer';}return sid.indexOf('robo-')===0?'Robo':'';}
function letterOf(sid,i){
  if(i==null)return '';const s=SL.find(x=>x.id===sid);
  if(s&&s.q)return s.q.labels?s.q.labels[i]:'ABCD'[i];
  if(s&&s.tv){const t=team(i);return t?t.name:'';}
  if(s&&s.wall)return i===-1?'Escribió ejemplo':(['🔥','👏','💡','🤯'][i]||'');

}
function correctOf(sid){

  if(sid.indexOf('robo-')===0){const n=+sid.slice(5),st=S.steal;if(n===st.aid&&st.q>=0)return 'ABC'[STEAL_BANK[st.q].c];}

  Object.keys(S.dv).forEach(function(sid){const a=S.dv[sid];Object.keys(a).forEach(d=>put(d,sid,{i:a[d].i,b:a[d].b,tm:a[d].tm}));});
  Object.keys(S.res).forEach(function(sid){const a=S.res[sid];Object.keys(a).forEach(d=>put(d,sid,{i:a[d].i,b:a[d].b,ok:a[d].ok,tm:a[d].tm}));});

const CRCT=(function(){const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const w16=(a,v)=>a.push(v&255,(v>>8)&255),w32=(a,v)=>a.push(v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255);
  files.forEach(function(f){
    const nb=enc.encode(f.n),d=enc.encode(f.d),crc=crc32(d),h=[];
    w32(h,0x04034b50);w16(h,20);w16(h,0x0800);w16(h,0);w16(h,0);w16(h,0x21);w32(h,crc);w32(h,d.length);w32(h,d.length);w16(h,nb.length);w16(h,0);
    parts.push(new Uint8Array(h),nb,d);
    const c=[];w32(c,0x02014b50);w16(c,20);w16(c,20);w16(c,0x0800);w16(c,0);w16(c,0);w16(c,0x21);w32(c,crc);w32(c,d.length);w32(c,d.length);w16(c,nb.length);w16(c,0);w16(c,0);w16(c,0);w16(c,0);w32(c,0);w32(c,off);
    cd.push(new Uint8Array(c),nb);
    off+=h.length+nb.length+d.length;
  });
  let cds=0;cd.forEach(x=>{cds+=x.length;});
  const e=[];w32(e,0x06054b50);w16(e,0);w16(e,0);w16(e,files.length);w16(e,files.length);w32(e,cds);w32(e,off);w16(e,0);
  return new Blob(parts.concat(cd,[new Uint8Array(e)]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xColN(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function xEsc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');}
function xSheet(rows){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="20" width="22" customWidth="1"/></cols><sheetData>';
  rows.forEach(function(r,ri){x+='<row r="'+(ri+1)+'">';r.forEach(function(v,ci){
    const ref=xColN(ci)+(ri+1);
    if(typeof v==='number'&&isFinite(v))x+='<c r="'+ref+'"><v>'+v+'</v></c>';
    else x+='<c r="'+ref+'" t="inlineStr"'+(ri===0?' s="1"':'')+'><is><t>'+xEsc(v==null?'':v)+'</t></is></c>';
  });x+='</row>';});
  return x+'</sheetData></worksheet>';
}

const T={left:0,total:0,end:0,run:false,iv:null};
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function beep(){
  try{const A=window.AudioContext||window.webkitAudioContext;const a=new A();
    [0,.28,.56].forEach(function(d){const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=d<.5?880:1175;g.gain.setValueAtTime(.0001,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.4,a.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.25);o.connect(g);g.connect(a.destination);o.start(a.currentTime+d);o.stop(a.currentTime+d+.26);});
  }catch(e){}
}
function drawT(){$('#tt').textContent=fmt(T.left);}
function startTimer(sec){stopTimer(true);T.total=sec;T.left=sec;T.end=Date.now()+sec*1000;T.run=true;$('#timer').classList.remove('end');$('#timer').style.display='flex';drawT();
  T.iv=setInterval(function(){T.left=(T.end-Date.now())/1000;if(T.left<=0){T.left=0;T.run=false;clearInterval(T.iv);drawT();$('#timer').classList.add('end');beep();}else drawT();},200);}
function stopTimer(keep){if(T.iv)clearInterval(T.iv);T.run=false;if(!keep){T.left=0;$('#timer').style.display='none';}}
$('#timer').addEventListener('click',function(e){
  const b=e.target.closest('[data-t]');if(!b)return;const k=b.dataset.t;
  if(k==='toggle'){if(T.run){T.left=(T.end-Date.now())/1000;stopTimer(true);}else if(T.left>0){T.end=Date.now()+T.left*1000;T.run=true;T.iv=setInterval(function(){T.left=(T.end-Date.now())/1000;if(T.left<=0){T.left=0;T.run=false;clearInterval(T.iv);drawT();$('#timer').classList.add('end');beep();}else drawT();},200);}}
  if(k==='reset'){stopTimer(true);T.left=T.total;T.end=Date.now()+T.left*1000;$('#timer').classList.remove('end');drawT();}
  if(k==='add60'){T.left+=60;T.end+=60000;drawT();}
  if(k==='sub60'){T.left=Math.max(0,T.left-60);T.end-=60000;drawT();}
  if(k==='hide'){stopTimer();}
});

function openGoto(){
  let h='<h4>☰ Ir a… ('+SL.length+' diapositivas · 80 min)</h4><div class="gg">';
  SL.forEach(function(s,i){h+='<button data-g="'+i+'" class="'+(i===S.idx?'cur':'')+'"><small>'+(i+1)+' · '+s.blk+' · min '+s.t+'</small>'+esc(s.title.replace(/<[^>]+>/g,''))+'</button>';});
  h+='</div>';$('#goto').innerHTML=h;$('#goto').style.display='block';
}
$('#goto').addEventListener('click',function(e){const b=e.target.closest('[data-g]');if(!b)return;$('#goto').style.display='none';go(+b.dataset.g);});
function showNotes(){const s=SL[S.idx];$('#notes').innerHTML='<b>Guía · '+(S.idx+1)+'. '+esc(s.title.replace(/<[^>]+>/g,''))+'</b><br>'+(s.notes||'—');$('#notes').style.display='block';}
function toggle(id,fn){const el=$(id);if(el.style.display==='block'){el.style.display='none';}else{fn?fn():el.style.display='block';}}

/* ================= Barra, teclado, fit ================= */
$('#bar').addEventListener('click',function(e){
  const b=e.target.closest('[data-b]');if(!b)return;const k=b.dataset.b;
  if(k==='prev')prev();else if(k==='next')next();else if(k==='goto')openGoto();
  else if(k==='score')toggle('#score',renderScoreShow);else if(k==='teams')openTeams();else if(k==='roster')toggleRoster();else if(k==='rand')randTeam();
  else if(k==='timer'){const t=$('#timer');if(t.style.display==='flex'){stopTimer();}else{t.style.display='flex';drawT();}}
  else if(k==='notes')toggle('#notes',showNotes);else if(k==='live')toggleLive();else if(k==='fs')fs();
});
function renderScoreShow(){renderScore();$('#score').style.display='block';}
function fs(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}}
function closeAll(){['#score','#modal','#goto','#notes','#live','#roster'].forEach(s=>$(s).style.display='none');$('#rand').style.display='none';clearInterval(rIv);if(S.teams)resetArm=false;}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
  else if(k==='Home')go(0);else if(k==='End')go(SL.length-1);
  else if(k==='s'||k==='S')toggle('#score',renderScoreShow);
  else if(k==='e'||k==='E')openTeams();
  else if(k==='i'||k==='I')toggleRoster();
  else if(k==='n'||k==='N')toggle('#notes',showNotes);
  else if(k==='g'||k==='G')openGoto();
  else if(k==='r'||k==='R')randTeam();
  else if(k==='t'||k==='T'){const t=$('#timer');if(t.style.display==='flex')stopTimer();else{t.style.display='flex';drawT();}}
  else if(k==='l'||k==='L')toggleLive();
  else if(k==='f'||k==='F')fs();
  else if(k==='Escape'){if($('#modal').style.display==='block'){closeTeams();}closeAll();}
});
let tx=null;
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>80){if(dx<0)next();else prev();}},{passive:true});
function fit(){const sc=Math.min(innerWidth/1920,innerHeight/1080);cv.style.transform='translate(-50%,-50%) scale('+sc+')';}
window.addEventListener('resize',fit);fit();
if(S.idx>=SL.length)S.idx=0;
render();
if(S.live)liveStart();
if(!S.setup){openTeams();}
window.__S25=function(){return {S:S,SL:SL,LV:LV,ACT:ACT};};
})();
</script>
</body>
