<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sesión 19 · Prototipar — Presentación de clase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141a; --bg2:#1b1f29; --card:#222733; --card2:#2b3140; --ink:#f6f7fb; --mut:#a9b0c3;
  --or:#ff6b1a; --am:#ffc233; --mint:#2ee6a6; --pk:#ff4f8b; --cy:#3dd6f5; --vi:#a78bfa; --red:#ff5d5d;
  --font:'Poppins','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#06070a;color:var(--ink);font-family:var(--font);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#stage{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:radial-gradient(1200px 700px at 85% -10%,#2a1f3a 0%,transparent 60%),radial-gradient(900px 600px at -5% 105%,#3a2414 0%,transparent 60%),var(--bg);
  border-radius:6px}
#cv::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1.5px,transparent 1.5px);background-size:38px 38px;pointer-events:none}
#sl{position:absolute;inset:0;padding:64px 96px 70px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.kick{font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--or)}
.tm{font-size:24px;color:var(--mut);background:rgba(255,255,255,.06);padding:6px 18px;border-radius:99px}
h1{font-size:150px;line-height:1;font-weight:800;letter-spacing:-.03em}
h2{font-size:70px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin-bottom:26px}
h2 em,h1 span{font-style:normal;color:var(--or)}
h3{font-size:38px;font-weight:700;margin-bottom:10px}
p,li{font-size:38px;line-height:1.35;color:#dfe3ef}
.sm{font-size:28px;color:var(--mut)}
.mut{color:var(--mut)}
b,strong{color:#fff}
.hl{color:var(--am)}
.grid{display:grid;gap:28px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.card{background:var(--card);border-radius:28px;padding:34px 36px;border:2px solid rgba(255,255,255,.06);position:relative}
.card .ic{font-size:70px;line-height:1;margin-bottom:14px;display:block}
.card p{font-size:32px}
.card h3{font-size:36px}
.num{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--or);color:#fff;font-weight:800;font-size:34px;margin-bottom:14px}
.btn{background:var(--or);color:#fff;font-weight:700;font-size:28px;padding:16px 30px;border-radius:99px;box-shadow:0 8px 24px rgba(255,107,26,.35);transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:var(--card2);box-shadow:none}
.btn.mint{background:var(--mint);color:#06281c;box-shadow:0 8px 24px rgba(46,230,166,.3)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.callout{background:linear-gradient(90deg,rgba(255,194,51,.16),rgba(255,194,51,.04));border-left:8px solid var(--am);border-radius:18px;padding:22px 30px;font-size:34px;margin-top:26px}
.callout.or{background:linear-gradient(90deg,rgba(255,107,26,.2),rgba(255,107,26,.04));border-color:var(--or)}
.callout.mint{background:linear-gradient(90deg,rgba(46,230,166,.18),rgba(46,230,166,.04));border-color:var(--mint)}
.rv{opacity:0;transform:translateY(22px);transition:.4s;pointer-events:none}
.rv.on{opacity:1;transform:none;pointer-events:auto}
/* chips */
.chip{--c:#fff;display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--c) 22%,#1a1d26);border:3px solid var(--c);color:#fff;font-weight:700;font-size:25px;padding:6px 18px;border-radius:99px;white-space:nowrap;line-height:1.2}
button.chip:hover{filter:brightness(1.25)}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--c);display:inline-block}
/* cover */
.cover{height:100%;display:flex;flex-direction:column;justify-content:center;position:relative}
.cover .eyebrow{font-size:30px;font-weight:700;letter-spacing:.16em;color:var(--am);text-transform:uppercase;margin-bottom:12px}
.cover .sub{font-size:52px;font-weight:700;margin-top:18px;color:#fff}
.cover .tag{font-size:36px;color:var(--mut);margin:10px 0 36px}
.cover .rules{display:flex;gap:18px;margin-bottom:30px}
.cover .rules div{background:var(--card);border-radius:20px;padding:16px 24px;font-size:27px;border:2px solid rgba(255,255,255,.07)}
.blob{position:absolute;right:-40px;top:40px;font-size:340px;opacity:.9;filter:drop-shadow(0 30px 60px rgba(255,107,26,.35));transform:rotate(-10deg)}
.blob2{position:absolute;right:120px;bottom:110px;font-size:150px;transform:rotate(14deg)}
/* vote */
.opts{display:grid;gap:12px;margin-top:4px}
.opt{display:grid;grid-template-columns:70px 1fr auto 56px;align-items:center;gap:20px;background:var(--card);border:3px solid rgba(255,255,255,.07);border-radius:22px;padding:8px 26px;min-height:84px;position:relative;overflow:hidden}
.opt .L{font-size:40px;font-weight:800;color:var(--am)}
.opt .tx{font-size:32px;line-height:1.15}
.opt .vc{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:760px}
.opt .cnt{font-size:36px;font-weight:800;text-align:right;color:var(--mut)}
.opt .bar{position:absolute;left:0;bottom:0;height:7px;background:var(--cy);transition:.4s}
.opt.ok{border-color:var(--mint);background:rgba(46,230,166,.13)}
.opt.ok .L{color:var(--mint)}
.opt.no{opacity:.45}
.tray{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:56px}
.tray .lbl{font-size:24px;color:var(--mut);margin-right:6px}
.hint{font-size:22px;color:var(--mut)}
.expl{margin-top:14px;font-size:30px;background:rgba(46,230,166,.12);border-left:8px solid var(--mint);padding:18px 26px;border-radius:16px}
.q{font-size:50px;line-height:1.12;font-weight:800;margin-bottom:16px}
.q.s{font-size:46px}
.case{font-size:34px;background:var(--card2);border-radius:20px;padding:14px 28px;margin-bottom:14px;border:2px dashed rgba(255,255,255,.18)}
/* flip */
.flip{perspective:1200px;height:520px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;padding:34px;display:flex;flex-direction:column;justify-content:center;border:2px solid rgba(255,255,255,.08)}
.flip .fa{background:var(--card);align-items:center;text-align:center}
.flip .fa .ic{font-size:120px;margin-bottom:16px}
.flip .fa h3{font-size:44px}
.flip .fa small{font-size:24px;color:var(--mut);margin-top:12px}
.flip .fb{background:linear-gradient(160deg,#2f2147,#222733);transform:rotateY(180deg)}
.flip .fb p{font-size:28px;margin-bottom:12px}
.flip .fb b{color:var(--am)}
/* steps ladder */
.stairs{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;align-items:end;height:620px}
.stair{background:var(--card);border-radius:28px;padding:30px;border:2px solid rgba(255,255,255,.07);display:flex;flex-direction:column;justify-content:flex-start}
.stair:nth-child(1){height:60%;border-top:10px solid var(--mint)}
.stair:nth-child(2){height:80%;border-top:10px solid var(--am)}
.stair:nth-child(3){height:100%;border-top:10px solid var(--pk)}
.stair h3{font-size:44px}.stair p{font-size:29px}
.tag2{display:inline-block;background:var(--or);color:#fff;font-weight:700;font-size:24px;border-radius:99px;padding:4px 16px;margin-bottom:10px}
/* timeline */
.tl{display:flex;flex-direction:column;gap:16px}
.tl .st{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;background:var(--card);border-radius:22px;padding:16px 26px;border:2px solid rgba(255,255,255,.06)}
.tl .st .yr{font-size:34px;font-weight:800;color:var(--or)}
.tl .st p{font-size:31px}
/* quadrants */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.quad .card{min-height:250px}
.quad h3{font-size:44px}
.quad .card p{font-size:29px}
/* clues */
.clue{background:var(--card);border-radius:22px;padding:20px 30px;font-size:38px;margin-bottom:14px;display:flex;gap:20px;align-items:center;border:2px solid rgba(255,255,255,.07)}
.clue .pt{font-weight:800;color:var(--am);font-size:30px;min-width:100px}
.answer{font-size:72px;font-weight:800;color:var(--mint);margin:16px 0}
/* podium */
.pod{display:flex;gap:30px;align-items:flex-end;justify-content:center;height:560px}
.pod .col{width:420px;text-align:center}
.pod .blk{border-radius:26px 26px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:22px;font-size:90px;font-weight:800}
.pod .nm{font-size:40px;font-weight:700;margin-bottom:10px}
.pod .pt{font-size:36px;color:var(--am);font-weight:700;margin-bottom:8px}
.confetti{position:absolute;top:-60px;font-size:44px;animation:fall 5s linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(1200px) rotate(360deg)}}
/* floating UI */
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(14,16,22,.92);border:1px solid rgba(255,255,255,.14);padding:6px 10px;border-radius:99px;z-index:50;opacity:.55;transition:.2s;backdrop-filter:blur(6px)}
#bar:hover{opacity:1}
#bar button{background:transparent;font-size:15px;font-weight:600;padding:8px 12px;border-radius:99px;color:#e9ecf6;white-space:nowrap}
#bar button:hover{background:rgba(255,255,255,.12)}
#bar .ct{font-size:15px;color:#aab;padding:0 8px;min-width:64px;text-align:center}
#prog{position:fixed;left:0;top:0;height:4px;background:var(--or);z-index:60;transition:.3s}
.panel{position:fixed;z-index:70;background:#171a23;border:1px solid rgba(255,255,255,.16);border-radius:20px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#score{top:14px;right:14px;width:430px;max-height:calc(100vh - 90px);overflow:auto;padding:18px;display:none}
#score h4,#modal h4,#goto h4{font-size:20px;margin-bottom:10px}
.sr{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
.sr .pts{font-weight:800;font-size:22px;color:var(--am);min-width:40px;text-align:right}
.sr .adj{grid-column:2/4;display:flex;gap:5px;flex-wrap:wrap}
.sr .adj button,.mini{background:#2a3040;font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px}
.sr .adj button:hover,.mini:hover{background:#3b4358}
.log{font-size:12px;color:#9aa;margin-top:10px;line-height:1.5}
#modal{top:50%;left:50%;transform:translate(-50%,-50%);width:640px;max-height:84vh;overflow:auto;padding:24px;display:none}
.tr{display:grid;grid-template-columns:24px 1fr 34px;gap:10px;align-items:center;margin-bottom:8px}
.tr input{background:#0f1118;border:1px solid #3a4152;border-radius:10px;color:#fff;padding:8px 12px;font:600 16px var(--font);width:100%}
.tr .dot{width:22px;height:22px;border-radius:50%}
#goto{top:50%;left:50%;transform:translate(-50%,-50%);width:1000px;max-width:94vw;max-height:86vh;overflow:auto;padding:22px;display:none}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.gg button{background:#222733;text-align:left;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.25}
.gg button small{display:block;color:var(--am);font-weight:600;font-size:12px;margin-bottom:2px}
.gg button.cur{outline:2px solid var(--or)}
.gg button:hover{background:#31384a}
#notes{left:50%;bottom:62px;transform:translateX(-50%);width:min(1100px,92vw);padding:18px 24px;display:none;font-size:17px;line-height:1.5;max-height:42vh;overflow:auto}
#notes b{color:var(--am)}
#timer{top:14px;left:14px;padding:10px 16px;display:none;align-items:center;gap:12px}
#timer .tt{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;min-width:150px}
#timer.end{background:#6b1414;animation:fl .5s 6}
@keyframes fl{50%{background:#a82020}}
#timer button{background:#2a3040;padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px}
#rand{inset:0;border-radius:0;display:none;place-items:center;background:rgba(6,7,10,.9)}
#rand .box{text-align:center}
#rand .big{font-size:110px;font-weight:800;margin:20px 0;min-width:900px}
#rand .st{font-size:28px;color:var(--mut)}
.help{font-size:13px;color:#8d96ab;margin-top:12px;line-height:1.6}
kbd{background:#2a3040;border-radius:6px;padding:1px 7px;font-size:12px}
.fb{display:flex}

/* ---- Arena / juego ---- */
#cv.game{background:radial-gradient(1100px 650px at 90% -10%,#4a1a6b 0%,transparent 60%),radial-gradient(900px 600px at -5% 105%,#0f4a63 0%,transparent 60%),#0d0f1a}
.game .kick{color:var(--cy)}
.gbanner{display:flex;align-items:center;gap:22px;margin-bottom:10px}
.gb1{font-weight:800;font-size:24px;letter-spacing:.12em;color:#0d0f1a;background:var(--am);padding:6px 18px;border-radius:10px}
.gbanner b{font-size:34px;font-weight:800;color:#fff;letter-spacing:.04em}
.gb2{font-size:24px;color:var(--mut)}
.gtitle{font-size:56px;font-weight:800;line-height:1.1;margin:4px 0 14px}
.gtitle em{font-style:normal;color:var(--cy)}
.cover .rules{max-width:1380px;flex-wrap:wrap}
.qrbox{position:absolute;right:0;bottom:40px;width:250px;background:#fff;border-radius:22px;padding:14px;text-align:center;color:#111;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:3}
.qrbox svg{width:100%;height:auto;display:block}
.qrbox b{display:block;color:#111;font-size:26px;margin-top:6px}
.qrbox span{display:block;color:#444;font-size:19px;line-height:1.2}
.tl4 .card p{font-size:26px}.tl4 .card h3{font-size:32px}.tl4 .card{padding:24px 26px}
.strip{position:absolute;left:96px;right:96px;bottom:62px;display:flex;gap:10px;flex-wrap:wrap}
.sc{flex:1;min-width:150px;background:rgba(255,255,255,.07);border-radius:14px;padding:6px 12px 10px;border-left:6px solid var(--c);position:relative;overflow:hidden}
.sc .n{font-size:18px;color:#cfd4e6;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{font-size:34px;line-height:1.05;display:block}
.sc i{position:absolute;left:0;bottom:0;height:6px;background:var(--c);transition:width .8s}
.sc.bump{animation:bump 1s;box-shadow:0 0 0 3px var(--mint)}
.sc.drop{animation:shk .6s;box-shadow:0 0 0 3px var(--red)}
@keyframes bump{30%{transform:scale(1.12)}}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}}
.clue.lock{opacity:.4}
.cbar{height:16px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:8px 0 12px}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--am),var(--red));transition:width .25s linear}
.buzzed{font-size:44px;font-weight:800;margin:8px 0 12px;animation:pin .4s}
.chip.locked{opacity:.5;text-decoration:line-through}
.btn.big{font-size:34px;padding:20px 44px}
.btn.red{background:var(--red);box-shadow:0 8px 24px rgba(255,93,93,.35)}
.pop-in{animation:pin .5s}
@keyframes pin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.obox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.ob{background:rgba(255,255,255,.07);border-radius:14px;padding:8px 18px;font-size:27px;line-height:1.2}
.ob b{color:var(--am);margin-right:8px}
.ob.ok{background:rgba(46,230,166,.2);outline:3px solid var(--mint)}.ob.no{opacity:.45}
.bt{display:flex;flex-direction:column;gap:6px}
.br{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:14px;padding:5px 10px}
.br .chip{min-width:190px;font-size:20px}
.cell{width:56px;height:48px;border-radius:12px;background:#2a3040;font-size:24px;font-weight:800;color:#cfd4e6}
.cell:hover{background:#3b4358}
.cell.sel{background:var(--cy);color:#06222b}
.cell.ok{outline:4px solid var(--mint)}
.cell.bad{background:var(--red);color:#fff}
.bb{margin-left:auto;min-width:64px;height:48px;border-radius:12px;background:var(--am);color:#2b1f00;font-size:26px;font-weight:800}
.dice{font-size:150px;line-height:1;margin:6px 0}
.steal{font-size:38px;margin-top:14px;background:rgba(255,93,93,.15);border-left:8px solid var(--red);padding:14px 26px;border-radius:16px}
.card.glow{box-shadow:0 0 30px rgba(61,214,245,.18);border-color:rgba(61,214,245,.35)}
.pop{position:absolute;font-size:60px;pointer-events:none;z-index:40;animation:pp 1.6s ease-out forwards}
@keyframes pp{to{transform:translate(var(--dx),var(--dy)) rotate(40deg);opacity:0}}
</style>
</head>
<body>
<div id="prog"></div>
<div id="stage"><div id="cv"><div id="sl"></div></div></div>

<div id="bar">
  <button data-b="prev" title="Anterior (←)">◀</button>
  <span class="ct" id="ct">1 / 1</span>
  <button data-b="next" title="Siguiente (→ / espacio)">▶</button>
  <button data-b="goto" title="Ir a… (G)">☰ Ir a</button>
  <button data-b="score" title="Marcador (S)">🏆 Marcador</button>
  <button data-b="teams" title="Equipos (E)">👥 Equipos</button>
  <button data-b="rand" title="Equipo al azar (R)">🎲 Al azar</button>
  <button data-b="timer" title="Temporizador (T)">⏱</button>
  <button data-b="notes" title="Notas de la profesora (N)">📝 Guía</button>
  <button data-b="fs" title="Pantalla completa (F)">⛶</button>
</div>

<div class="panel" id="score"></div>
<div class="panel" id="modal"></div>
<div class="panel" id="goto"></div>
<div class="panel" id="notes"></div>
<div class="panel" id="timer"><span class="tt" id="tt">00:00</span><button data-t="toggle">⏯</button><button data-t="reset">↺</button><button data-t="add60">+1 min</button><button data-t="sub60">−1 min</button><button data-t="hide">✕</button></div>
<div class="panel" id="rand"><div class="box"><div class="st">Equipo elegido al azar</div><div class="big" id="rbig">…</div><div class="row" style="justify-content:center"><button class="btn" id="ragain">🎲 Otra vez</button><button class="btn alt" id="rclose">Cerrar</button></div></div></div>

<script>
(function(){
'use strict';
/* ================= Estado ================= */
const KEY='s19_prototipar_presentacion_v1';
const COLORS=['#ff6b1a','#3dd6f5','#ffc233','#ff4f8b','#2ee6a6','#a78bfa','#ff5d5d','#60a5fa','#f59e0b','#34d399','#e879f9','#94a3b8'];
function defTeams(n){const a=[];for(let i=1;i<=n;i++)a.push({id:i,name:'Equipo '+i,c:(i-1)%COLORS.length});return a;}
function fresh(){return {teams:defTeams(8),idx:0,votes:{},bets:{},rev:{},rvn:{},log:[],stars:{},clue:{},pairs:null,steal:{t:null,v:null,n:1},nid:100,seq:0,setup:false};}
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
if(!S||!S.teams){S=fresh();}
S.bets=S.bets||{};S.steal=S.steal||{t:null,v:null,n:1};S.clue=S.clue||{};S.stars=S.stars||{};
Object.keys(S.clue).forEach(function(k){const c=S.clue[k];if(!c||c.st===undefined||c.st==='run'||c.st==='buzz'){delete S.clue[k];}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);
const sl=$('#sl'),cv=$('#cv');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const team=id=>S.teams.find(t=>t.id==id);
const col=t=>COLORS[t.c%COLORS.length];
const pts=id=>S.log.filter(l=>l.team==id).reduce((a,l)=>a+l.d,0);
function addLog(teamId,d,why,sid){S.log.push({id:++S.seq,team:teamId,d:d,why:why,sid:sid||''});}

/* ---------- Sonidos ---------- */
let AC=null;
function tone(f,d,at,type,vol){
  try{const A=window.AudioContext||window.webkitAudioContext;if(!AC)AC=new A();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;
    const t0=AC.currentTime+(at||0);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);}catch(e){}
}
function sfx(k){
  if(k==='ok'){[523,659,784,1047].forEach((f,i)=>tone(f,.18,i*.09));}
  else if(k==='no'){tone(180,.35,0,'sawtooth',.2);tone(140,.4,.12,'sawtooth',.2);}
  else if(k==='buzz'){tone(740,.12,0,'square',.2);tone(990,.2,.1,'square',.2);}
  else if(k==='start'){[392,523,659].forEach((f,i)=>tone(f,.14,i*.12));}
  else if(k==='tick'){tone(880,.08,0,'square',.12);}
  else if(k==='dice'){tone(300+Math.random()*300,.05,0,'square',.1);}
  else if(k==='win'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,i*.1));}
}
function burst(emojis){
  const arr=emojis||['🎉','⭐','✨','🚀','🧩'];
  for(let i=0;i<26;i++){
    const s=document.createElement('span');s.className='pop';s.textContent=arr[i%arr.length];
    s.style.left=(200+Math.random()*1500)+'px';s.style.top=(300+Math.random()*400)+'px';
    s.style.setProperty('--dx',(Math.random()*400-200)+'px');s.style.setProperty('--dy',(-200-Math.random()*300)+'px');
    cv.appendChild(s);setTimeout(()=>s.remove(),1700);
  }
}

/* ---------- Marcador de juego (franja inferior) ---------- */
function strip(){
  const mx=Math.max(10,...S.teams.map(t=>pts(t.id)));
  const h=S.teams.map(function(t){
    const p=pts(t.id),bump=(lastShown[t.id]!==undefined&&p>lastShown[t.id])?' bump':'',drop=(lastShown[t.id]!==undefined&&p<lastShown[t.id])?' drop':'';
    lastShown[t.id]=p;
    return '<div class="sc'+bump+drop+'" style="--c:'+col(t)+'"><span class="n">'+esc(t.name)+(S.stars[t.id]?' ⭐':'')+'</span><b>'+p+'</b><i style="width:'+Math.max(3,100*Math.max(0,p)/mx)+'%"></i></div>';
  }).join('');
  return '<div class="strip">'+h+'</div>';
}

  return '<div class="gbanner"><span class="gb1">🎮 ARENA DEL PROTOTIPO</span><b>'+round+'</b><span class="gb2">'+sub+'</span></div>';

  html:function(s){

      return '<div class="opt'+cls+'"><span class="L">'+(o.labels?o.labels[i]:'ABCD'[i])+'</span><span class="tx">'+tx+'</span><span class="vc">'+here.map(t=>chip(t,rev?'':'cyc',s.id)).join('')+'</span><span class="cnt">'+here.length+'</span><span class="bar" style="width:'+(100*here.length/tot)+'%"></span></div>';

/* ---------- Ronda de pistas con buzzer (juego) ---------- */
function cs(id){return S.clue[id]||(S.clue[id]={st:'idle',n:1,el:0,t0:0,buzz:null,locked:[],w:null});}
function clueSlide(o){
  return {id:o.id,blk:o.blk,t:o.t,title:o.title,notes:o.notes||'',game:true,
  html:function(s){
    const c=cs(s.id),P=[3,2,1];let h=banner(o.round,'Pista nueva cada 5 s · ¡toca tu equipo para frenar!');
    h+='<div class="gtitle">'+o.title+'</div>';
    for(let i=0;i<3;i++){
      const shown=(c.st==='idle')?false:(i<c.n)||c.st==='done';
      h+='<div class="clue'+(shown?'':' lock')+'"><span class="pt">'+P[i]+' pts</span><span>'+(shown?o.clues[i]:'🔒 Pista '+(i+1)+' · aún oculta')+'</span></div>';
    }
    h+='<div class="cbar"><i id="cbf" style="width:'+Math.min(100,(c.st==='run'?(Date.now()-c.t0)/150:(c.el||0)/.15))+'%"></i></div>';
    if(c.st==='idle'){h+='<div class="row" style="margin:14px 0"><button class="btn big" data-act="cStart" data-sid="'+s.id+'">▶ ¡Arrancar ronda!</button><span class="sm">Los equipos esperan listos…</span></div>';}
    else if(c.st==='run'){h+='<div class="tray"><span class="lbl">🔔 BUZZER:</span>'+S.teams.map(t=>(c.locked.indexOf(t.id)>-1)?'<span class="chip locked" style="--c:#555">🚫 '+esc(t.name)+'</span>':chip(t,'cBuzz',s.id)).join('')+'</div>';}
    else if(c.st==='buzz'){const t=team(c.buzz);h+='<div class="buzzed">🔔 ¡'+(t?chipStatic(t):'')+' frenó la ronda!</div><div class="row"><button class="btn mint" data-act="cOk" data-sid="'+s.id+'">✔ Correcto (+'+P[c.n-1]+')</button><button class="btn red" data-act="cNo" data-sid="'+s.id+'">✖ Incorrecto (−1 y bloqueado)</button></div>';}
    else{h+='<div class="answer pop-in">✔ '+o.answer+'</div><div class="row">'+(c.w?('<span class="sm">¡Punto para</span>'+chipStatic(team(c.w)||{name:'—',c:0})):'<span class="sm">Nadie acertó</span>')+'<button class="btn alt" data-act="cReset" data-sid="'+s.id+'">↺ Repetir ronda</button></div>';}
    return h+strip();
  }};
}
function tickClue(){
  const s=SL[S.idx];if(!s||!s.id||!s.game)return;const c=S.clue[s.id];if(!c||c.st!=='run')return;
  const el=(Date.now()-c.t0)/1000,nn=Math.min(3,1+Math.floor(el/5));
  if(nn!==c.n){c.n=nn;sfx('tick');render();return;}
  const f=document.getElementById('cbf');if(f)f.style.width=Math.min(100,el/15*100)+'%';
  if(el>=15){c.st='done';c.w=0;c.el=15;sfx('no');save();render();}
}
setInterval(tickClue,250);

function betSlide(o){
  return {id:o.id,blk:o.blk,t:o.t,title:o.title||o.q,notes:o.notes||'',game:true,bet:o,
  html:function(s){
    const v=S.votes[s.id]||{},bt=S.bets[s.id]||{},rev=!!S.rev[s.id];
    let h=banner(o.round,'Apuesta 1–3 pts: aciertas y ganas lo apostado, fallas y lo pierdes');
    h+='<div class="gtitle">'+o.q+'</div>';
    h+='<div class="obox">'+o.opts.map((tx,i)=>'<div class="ob'+(rev?(o.correct===i?' ok':' no'):'')+'"><b>'+('ABCD'[i])+'</b> '+tx+'</div>').join('')+'</div>';
    const half=Math.ceil(S.teams.length/2);
    const tbl=function(arr){return '<div class="bt">'+arr.map(function(t){
      const sel=v[t.id],b=bt[t.id]||1;
      return '<div class="br">'+chipStatic(t)+o.opts.map(function(_,i){
        let cls='cell';if(sel===i)cls+=' sel';if(rev&&o.correct===i)cls+=' ok';if(rev&&sel===i&&o.correct!==i)cls+=' bad';
        return '<button class="'+cls+'" '+(rev?'':'data-act="bcell" ')+'data-sid="'+s.id+'" data-team="'+t.id+'" data-i="'+i+'">'+'ABCD'[i]+'</button>';
      }).join('')+'<button class="bb" '+(rev?'':'data-act="bbet" ')+'data-sid="'+s.id+'" data-team="'+t.id+'">×'+b+'</button></div>';}).join('')+'</div>';};
    h+='<div class="grid g2" style="gap:30px;margin-top:10px">'+tbl(S.teams.slice(0,half))+tbl(S.teams.slice(half))+'</div>';
    h+='<div class="row" style="margin-top:12px"><button class="btn'+(rev?' alt':' big')+'" data-act="bReveal" data-sid="'+s.id+'">'+(rev?'Ocultar respuesta':'🎯 ¡Revelar!')+'</button><span class="hint">Toca la letra de cada equipo · toca ×n para cambiar su apuesta.</span></div>';
    if(rev&&o.explain)h+='<div class="expl">'+o.explain+'</div>';
    return h+strip();
  }};
}

notes:'<b>11–14 min.</b> Definición: dar forma a la solución, tangibilizar la idea; el usuario <b>toca</b>. Propósito: fallar rápido y barato; es una herramienta para aprender del usuario. Cierra con 🎲: dos equipos definen “prototipo” con sus palabras.',
html:function(){return '<h2>🧩 ¿Qué es <em>prototipar</em>?</h2>'
+'<p style="font-size:42px;max-width:1650px">Es <b>dar forma a la solución</b>: convertir una idea en algo <b class="hl">tangible</b>, para que el usuario <b>no solo imagine</b>… sino que pueda <b>tocarla</b>.</p>'
+'<div class="grid g3" style="margin-top:26px">'
+cardT('⚡','Ensayo rápido','<p>Una versión temprana de tu solución, hecha en poco tiempo.</p>')
+cardT('💸','Barato','<p>Si falla, pierdes poco: papel, cartón, post-its.</p>')
+cardT('🧪','Para aprender','<p>Nos deja <b>fallar veloz</b> y aprender del usuario.</p>')+'</div>'
+'<div class="callout or">🎯 <b>“Fallar rápido y barato”</b>: no buscamos un producto final, buscamos <b>una herramienta para aprender del usuario</b>. Pensar con las manos enriquece las ideas que ya tenías. <button class="btn" style="font-size:22px;padding:8px 20px;margin-left:14px" data-act="rand">🎲 Dilo con tus palabras</button></div>';}});

add({id:'tipos',blk:'Contenido',t:'14–18',title:'Tipos de prototipo',
notes:'<b>14–18 min.</b> Presenta los cuatro tipos (todo visible). Después van dos escenarios: “¿qué prototipo soy?”. Pide que piensen qué tipo encaja con su UChallenge; lo deciden en el taller.',
html:function(){return '<h2>🃏 <em>Tipos</em> de prototipo rápidos y baratos</h2><div class="grid g4" style="margin-top:14px">'
+cardT('✏️','Papel / Boceto','<p><b>Dibujos rápidos</b> de interfaces, empaques o flujos.</p><p class="sm">Ideal para <b>ideas abstractas</b>.</p>')
+cardT('📱','Digital','<p><b>Wireframes / mockups</b>: pantallas interactivas sin código.</p><p class="sm">Figma, Canva o PowerPoint · apps y páginas web.</p>')
+cardT('📦','Físico','<p><b>Maquetas 3D</b> con cartón, plastilina, legos u objetos reciclados.</p>')
+cardT('🎭','Servicio / Experiencia','<p><b>Storyboard</b> o <b>juego de roles</b>: actuar el servicio o dibujar el viaje del cliente (Customer Journey).</p>')+'</div>'
+'<div class="callout or">🤔 Piensen: ¿<b>qué tipo encajaría con el proyecto de tu equipo</b>? Lo deciden en el taller.</div>';}});
const TIPOS=['Papel / Boceto','Digital','Físico (maqueta)','Servicio / Experiencia'];
SL.push(voteSlide({id:'tipo1',blk:'Contenido',t:'14–18',q:'¿Qué prototipo soy? <span style="color:var(--am)">①</span>',
 case:'💡 Idea: <b>una app para encontrar roomies cerca del campus</b>',opts:TIPOS,correct:1,pts:2,
 explain:'<b>Digital</b>: pantallas interactivas sin código (wireframe en Figma, Canva o PowerPoint).',notes:'Escenario 1. +2 por acierto.'}));
SL.push(voteSlide({id:'tipo2',blk:'Contenido',t:'14–18',q:'¿Qué prototipo soy? <span style="color:var(--am)">②</span>',
 case:'💡 Idea: <b>un servicio de asesoría jurídica exprés para emprendedores</b>',opts:TIPOS,correct:3,pts:2,
 explain:'<b>Servicio / Experiencia</b>: se actúa con juego de roles o se dibuja un storyboard del recorrido del cliente.',notes:'Escenario 2 (aterrizado a Derecho). +2 por acierto.'}));

add({id:'fid',blk:'Contenido',t:'18–21',title:'Niveles de fidelidad',
notes:'<b>18–21 min.</b> Tres niveles, todo visible. Hoy trabajamos en baja fidelidad: es barata, rápida e invita a la crítica honesta.',
html:function(){return '<h2>🪜 Niveles de <em>fidelidad</em></h2><div class="stairs">'
+'<div class="stair"><span class="tag2">Hoy trabajamos aquí</span><h3>🪵 Baja</h3><p><b>Rápidos y económicos</b> (papel, cartón). Validan el <b>concepto general</b> en las primeras etapas.</p></div>'
+'<div class="stair"><h3>🖥️ Media</h3><p>La idea ya es clara y se validan <b>funcionalidad o flujo</b>. Ej.: prototipos digitales interactivos con funcionalidad limitada.</p></div>'
+'<div class="stair"><h3>🚀 Alta</h3><p>Se ven y actúan <b>casi como el producto real</b> (app interactiva, impresión 3D). Validan la <b>usabilidad final</b>.</p></div></div>'
+'<div class="callout">Lo tosco <b>es barato</b>, <b>es rápido</b> e <b>invita a la crítica honesta</b>: nadie teme sugerir cambios a un dibujo.</div>';}});
SL.push(voteSlide({id:'fid-v',blk:'Contenido',t:'18–21',q:'Tu equipo apenas tiene la idea y no sabe si le interesa a alguien. ¿Qué fidelidad conviene?',small:true,
 opts:['Baja (papel, cartón, bocetos)','Media (digital interactivo)','Alta (casi el producto real)','Ninguna: mejor lanzar el producto directo'],correct:0,pts:2,
 explain:'Entre más temprana la etapa, <b>más baja la fidelidad</b>: cuesta poco, se hace rápido y recibes crítica honesta.',notes:'+2 por acierto.'}));

add({id:'fitbit',blk:'Contenido',t:'21–25',title:'Caso de éxito: Fitbit',
notes:'<b>21–25 min.</b> Cuéntalo como historia. Dato clave: no vendieron estética, vendieron <b>funcionalidad y validación</b>. Fuente: IEEE Spectrum.',
html:function(){return '<h2>⌚ Caso Fitbit: de una caja de <em>madera</em> a 2,100 MDD</h2><div class="tl">'
+'<div class="st"><span class="yr">2007</span><p><b>La inspiración:</b> si el control del Nintendo Wii detecta el movimiento del cuerpo, ¿por qué no meter esa tecnología en un chip para el día a día?</p></div>'
+'<div class="st"><span class="yr">🪵</span><p><b>El “Frankenstein” de madera:</b> sin dinero para plástico ni fábricas, circuitos soldados a mano en una caja de madera balsa unida con cinta.</p></div>'
+'<div class="st"><span class="yr">$400K</span><p><b>El pitch:</b> consiguieron su primer gran financiamiento (400,000 USD) presentando ese pedazo de madera.</p></div>'
+'<div class="st"><span class="yr">🧽</span><p><b>Ingenio:</b> un fallo de la antena casi los quiebra… lo solucionaron con una esponja de baño a presión.</p></div>'
+'<div class="st"><span class="yr">25,000</span><p><b>El cierre:</b> la preventa recibió 25,000 órdenes y años después Google compró la empresa por miles de millones de dólares.</p></div></div>'
+'<div class="sm" style="margin-top:12px">Fuente: IEEE Spectrum · spectrum.ieee.org/fitbit</div>';}});
SL.push(voteSlide({id:'fit-v',blk:'Contenido',t:'21–25',q:'Con la cajita de madera, ¿qué les “vendieron” a los inversionistas?',
 opts:['La estética del producto','La funcionalidad y la validación','El precio final','La marca'],correct:1,pts:2,
 explain:'💡 <b>No necesitas presupuesto millonario ni el producto perfecto para empezar.</b> El ingenio y la validación rápida con lo que tengas a la mano valen más que el diseño final.',notes:'Discusión de 30 s antes de votar. +2.'}));

add({id:'err',blk:'Contenido',t:'25–28',title:'Errores comunes al prototipar',
notes:'<b>25–28 min.</b> Cinco errores, todo visible. Ejemplos universitarios: tres semanas puliendo una maqueta; gastar mucho en la primera versión; explicarlo demasiado.',
html:function(){const E=[['💘','Enamorarte del prototipo','Semanas puliendo algo que el usuario ni ha visto.'],['💰','Hacerlo muy caro','Gastar mucho en la primera versión.'],['🗣️','Explicarlo al usuario','Si tienes que explicarlo, el diseño falla.'],['🎯','Falta de objetivos','Construir sin saber qué quieres aprender.'],['🙉','Omitir el feedback','No escuchar al usuario a tiempo.']];
return '<h2>⚠️ Errores <em>comunes</em></h2><div class="grid g5" style="margin-top:20px">'+E.map(function(e){return '<div class="card" style="text-align:center"><span class="ic">'+e[0]+'</span><h3 style="font-size:32px">'+e[1]+'</h3><p style="font-size:26px">'+e[2]+'</p></div>';}).join('')+'</div>'
+'<div class="callout or">🔎 Regla de oro: <b>el usuario debe poder interactuar solo</b>. Si no te entiende sin tu explicación, el prototipo te está avisando algo.</div>';}});
SL.push(voteSlide({id:'err-v',blk:'Contenido',t:'25–28',q:'🕵️ Caza el error',
 case:'“Llevan 3 semanas puliendo colores y detalles de su maqueta, y se niegan a cambiarla aunque el usuario la critique.”',
 opts:['Enamorarse del prototipo','Hacerlo muy caro','Explicar el prototipo al usuario','Falta de objetivos'],correct:0,pts:2,
 explain:'<b>Enamorarse del prototipo.</b> Un prototipo sirve para aprender: si el usuario lo critica, lo mejoras o lo cambias.',notes:'+2 por acierto.'}));

/* ================= Arena (repaso gamificado) ================= */
add({id:'arena',blk:'Arena',t:'28–36',title:'Arena del Prototipo',game:true,
notes:'<b>28–36 min (8 min).</b> Tres rondas rápidas y robo final. Ronda 1: buzzer con pistas que aparecen solas. Ronda 2: apuesta. Ronda 3: mito o realidad con apuesta. Luego fase de robo con dado.',
html:function(){return banner('NIVEL 0','Repaso gamificado')
+'<div class="gtitle" style="font-size:78px">🏟️ ¡Bienvenidos a la <em>Arena</em>!</div><div class="grid g4" style="margin-top:10px">'
+'<div class="card glow"><span class="ic">🔔</span><h3>Ronda 1 · Buzzer</h3><p>Pistas que aparecen solas. <b>Frena la ronda</b> con tu equipo: 3, 2 o 1 pt.</p></div>'
+'<div class="card glow"><span class="ic">🎰</span><h3>Ronda 2 · Apuesta</h3><p>Elige tu respuesta y <b>apuesta 1–3 pts</b>. ¡Riesgo real!</p></div>'
+'<div class="card glow"><span class="ic">⚖️</span><h3>Ronda 3 · Mito o realidad</h3><p>Duelo rápido, otra vez con apuesta.</p></div>'
+'<div class="card glow" style="border-color:var(--pk)"><span class="ic">🏴‍☠️</span><h3>Final · Robo</h3><p>Los 3 primeros reciben ⭐ y <b>tiran el dado</b> para robar 1–3 pts.</p></div></div>'+strip();}});
SL.push(clueSlide({id:'g-clue',blk:'Arena',t:'28–36',round:'RONDA 1 · BUZZER',title:'¿Qué es? 🕵️',
 clues:['Es una historia, pero contada en dibujos.','Tiene seis pasos, como una historieta.','Sirve para prototipar un servicio o una experiencia.'],answer:'Storyboard',
 notes:'Pulsa “Arrancar”. Las pistas salen solas cada 5 s. El equipo que toca su nombre frena; tú decides si es correcto.'}));
SL.push(betSlide({id:'g-bet1',blk:'Arena',t:'28–36',round:'RONDA 2 · APUESTA',q:'¿Cuál es el <em>principal objetivo</em> de hacer un prototipo?',
 opts:['Impresionar a los inversionistas','Aprender del usuario gastando poco','Tener el producto final listo','Cumplir un requisito de la clase'],correct:1,
 explain:'Un prototipo es <b>una herramienta para aprender del usuario</b>, rápido y barato.',notes:'Cada equipo elige letra y apuesta (×1, ×2, ×3). Acierto: +apuesta. Fallo: −apuesta.'}));
SL.push(betSlide({id:'g-bet2',blk:'Arena',t:'28–36',round:'RONDA 3 · MITO O REALIDAD',q:'“Un buen prototipo debe verse <em>idéntico</em> al producto final.”',
 opts:['MITO','REALIDAD'],correct:0,
 explain:'<b>Mito.</b> En etapas tempranas se busca baja fidelidad: rápido, barato y fácil de criticar.',notes:'Duelo rápido con apuesta.'}));

add({id:'robo',blk:'Arena',t:'28–36',title:'Fase de robo',game:true,
notes:'Pulsa “Dar ⭐ a los 3 primeros”. Cada equipo con ⭐ elige a quién robar y tira el dado (1–3 pts). Una ⭐ por equipo.',
html:function(){
  const st=S.steal,holders=S.teams.filter(t=>(S.stars[t.id]||0)>0),thief=st.t?team(st.t):null,victim=st.v?team(st.v):null;
  let h=banner('FINAL · ROBO','Tira el dado y roba 1–3 pts');
  h+='<div class="row" style="margin:6px 0 12px"><button class="btn mint" data-act="giveStars">⭐ Dar ficha a los 3 primeros</button><span class="sm">Fichas vigentes: '+(holders.length?holders.map(chipStatic).join(' '):'ninguna')+'</span></div>';
  h+='<div class="grid g2" style="gap:24px"><div class="card"><h3>1 · ¿Quién roba?</h3><div class="row">'+(holders.length?holders.map(t=>chip(t,'pickT')).join(''):'<span class="sm">Primero reparte las fichas.</span>')+'</div>'
   +'<h3 style="margin-top:14px">2 · ¿A quién?</h3><div class="row">'+S.teams.filter(t=>!thief||t.id!=thief.id).map(t=>chip(t,'pickV')).join('')+'</div></div>'
   +'<div class="card" style="text-align:center"><div id="dice" class="dice">🎲</div>'
   +'<p style="font-size:30px;margin:6px 0">'+(thief?chipStatic(thief):'<span class="mut">…</span>')+' ➜ '+(victim?chipStatic(victim):'<span class="mut">…</span>')+'</p>'
   +'<button class="btn big" data-act="roll" '+((thief&&victim)?'':'disabled')+'>🎲 ¡Tirar dado!</button></div></div>';
  if(st.last)h+='<div class="steal pop-in">🏴‍☠️ '+st.last+'</div>';
  return h+strip();}});
add({id:'podio',blk:'Arena',t:'36',title:'Podio del día',
notes:'Celebra al podio. Los puntos son para jugar: el aprendizaje es el premio real. Siguiente: taller del entregable.',
html:function(){
  const r=S.teams.map(t=>({t:t,p:pts(t.id)})).sort((a,b)=>b.p-a.p);
  const order=[r[1],r[0],r[2]].filter(Boolean);
  let conf='';for(let i=0;i<24;i++){conf+='<span class="confetti" style="left:'+(Math.random()*1800|0)+'px;animation-delay:'+(Math.random()*5).toFixed(2)+'s">'+['🎉','⭐','✨','🧩'][i%4]+'</span>';}
  return conf+'<h2 style="text-align:center">🏆 <em>Podio</em> del día</h2><div class="pod">'+order.map(function(x){
    const idx=r.indexOf(x);const hh=idx==0?430:(idx==1?300:240);
    return '<div class="col"><div class="nm" style="color:'+col(x.t)+'">'+esc(x.t.name)+'</div><div class="pt">'+x.p+' pts</div><div class="blk" style="height:'+hh+'px;background:linear-gradient(180deg,'+col(x.t)+',#1b1f29)">'+(idx==0?'🥇':idx==1?'🥈':'🥉')+'</div></div>';}).join('')+'</div>'
    +'<div class="row" style="justify-content:center;margin-top:20px">'+r.slice(3).map(x=>chipStatic(x.t)+'<span class="sm" style="margin:0 12px 0 -6px">'+x.p+'</span>').join('')+'</div>';}});

/* ================= Taller del entregable ================= */
add({id:'taller',blk:'Taller del entregable',t:'36–40',title:'Taller: construye tu prototipo',
notes:'<b>36–40 min:</b> instrucciones (4 min). Después los equipos trabajan ~37 min. Mid-check: camina y pregunta “¿qué quieres aprender de tu usuario con este boceto?”. Roles rotan: dibujante, presentador/a, observador/a, escriba. Recursos: hojas, plumones y post-its.',
html:function(){return '<h2>🎨 <em>Taller</em>: tu prototipo de baja fidelidad</h2>'
+'<div class="grid g4 tl4" style="margin-top:6px">'
+'<div class="card"><span class="num">1</span><h3>Definan · 3 min</h3><p>Elijan el <b>tipo</b> y completen: “Nuestro prototipo debe permitir que el usuario ___”.</p><button class="btn" style="margin-top:12px" data-act="timer" data-sec="180">▶ 3:00</button></div>'
+'<div class="card"><span class="num">2</span><h3>Dibujen · 15 min</h3><p>Un <b>Storyboard</b> (6 pasos) o un <b>Boceto</b> de cómo funciona su solución.</p><button class="btn" style="margin-top:12px" data-act="timer" data-sec="900">▶ 15:00</button></div>'
+'<div class="card"><span class="num">3</span><h3>Intercambien · 10 min</h3><p>A muestra a B <b>sin explicar de más</b>; B observa y evalúa. Luego cambian (5 + 5).</p><button class="btn" style="margin-top:12px" data-act="timer" data-sec="300">▶ 5:00</button></div>'
+'<div class="card"><span class="num">4</span><h3>Matriz · 7 min</h3><p>Completen su <b>Matriz de Feedback</b> y pídanle su firma al equipo evaluador.</p><button class="btn" style="margin-top:12px" data-act="timer" data-sec="420">▶ 7:00</button></div></div>'
+'<div class="grid g2" style="margin-top:20px"><div class="callout mint" style="margin:0">📦 <b>Producto esperado:</b> boceto/storyboard + Matriz de Feedback firmada.</div>'
+'<div class="callout" style="margin:0">🧰 Hojas, plumones y post-its · Roles: 🎨 dibuja · 🗣️ presenta · 👀 observa · ✍️ escribe (¡roten!)</div></div>'
+'<div class="callout or">Quedan ~2 min para <b>digitalizar o mejorar</b> si alcanzan. <b>Función clave primero</b>: no pulan, prueben.</div>';}});

add({id:'parejas',blk:'Taller del entregable',t:'40–77',title:'Parejas y matriz de feedback',
notes:'Proyecta esta diapositiva durante el intercambio. “Reordenar” genera otras parejas; si hay impar, un equipo forma trío. Regla de oro: el que presenta NO explica de más. La matriz recibida lleva la <b>firma del equipo evaluador</b>.',
html:function(){ensurePairs();
return '<h2>🔁 Parejas de <em>intercambio</em> y matriz</h2><div class="grid g3" style="margin-top:0;gap:16px">'
+S.pairs.map(function(p){return '<div class="card" style="text-align:center;padding:16px"><div class="row" style="justify-content:center;gap:10px">'+p.map(function(id){const t=team(id);return t?chipStatic(t):'';}).join('<span style="font-size:34px">⇄</span>')+'</div></div>';}).join('')+'</div>'
+'<div class="row" style="margin:12px 0"><button class="btn alt" data-act="pairs" style="font-size:22px;padding:10px 22px">🔀 Reordenar</button><button class="btn" data-act="timer" data-sec="300" style="font-size:22px;padding:10px 22px">▶ 5:00 por turno</button><span class="sm">Regla de oro: <b>no expliques el prototipo</b>; deja que lo interpreten solos.</span></div>'
+'<div class="quad" style="gap:14px"><div class="card" style="border-color:var(--mint);min-height:0;padding:20px 26px"><h3 style="font-size:34px">✅ Qué funcionó</h3></div>'
+'<div class="card" style="border-color:var(--pk);min-height:0;padding:20px 26px"><h3 style="font-size:34px">🛠️ Qué mejorar</h3></div>'
+'<div class="card" style="border-color:var(--cy);min-height:0;padding:20px 26px"><h3 style="font-size:34px">❓ Dudas</h3></div>'
+'<div class="card" style="border-color:var(--am);min-height:0;padding:20px 26px"><h3 style="font-size:34px">💡 Nuevas ideas</h3></div></div>'
+'<div class="callout mint" style="margin-top:16px;font-size:30px">🪞 Al recibir feedback: ¿qué crítica nos <b>abrió los ojos</b>? ¿Nuestra idea <b>cambió o mejoró</b>? Recuerden: escuchar al usuario temprano <b>salva proyectos, tiempo y dinero</b>.</div>';}});

add({id:'tarea',blk:'Taller del entregable',t:'72–77',title:'Tarea y ticket de salida',
notes:'Dos entregas: (1) equipo: boceto digitalizado + Matriz firmada; (2) equipo: actividad interactiva de la sesión (un PDF por equipo, con % de participación, a Brightspace). <b>La Sesión 20 se habilita al terminar la actividad de hoy: muestra la clave PROTOTIPAR-19 solo a quien la completó.</b> El ticket de salida lo responde el equipo dentro de la actividad.',
html:function(){return '<h2>📚 <em>Tarea</em> y ticket de salida</h2><div class="grid g2" style="margin-top:6px">'
+'<div class="card"><h3>👥 En equipo (próxima clase)</h3><p style="font-size:29px"><b>Digitalizar el boceto</b> o mejorarlo (Canva o fotos claras) y subirlo junto con la <b>Matriz firmada</b>. Se evalúa: <b>claridad del prototipo</b> y <b>profundidad del feedback</b>.</p></div>'
+'<div class="card"><h3>🧩 Parte A de la ruta a la mini feria</h3><p style="font-size:29px">Completen <b>juntos la Parte A</b> (un integrante captura), descarguen el <b>PDF del equipo</b> con su % de participación y súbanlo a Brightspace. En la S20 la convierten en prototipo; la <b>mini feria es en la S22</b>. Traigan el material que anotaron y lean págs. 19–47.</p></div></div>'
+'<div class="card" style="margin-top:20px"><h3>🎟️ Ticket de salida (del equipo)</h3><p style="font-size:30px">① ¿Cuál es el <b>principal objetivo</b> de un prototipo? · ② Un tipo de prototipo ideal para <b>servicios</b> · ③ ¿Qué significa <b>“falla rápido y barato”</b>?</p></div>'
+'<div class="callout or">🔐 La <b>Sesión 20</b> se habilita solo cuando terminen la actividad de hoy.</div>';}});

add({id:'cierre',blk:'Cierre',t:'77–80',title:'¿Qué me llevo hoy?',
notes:'<b>77–80 min.</b> Cierra con los tres aprendizajes. Cada estudiante escribe su frase “Hoy me llevo…”; pide a 2 personas al azar que la lean.',
html:function(){return '<h2>🎒 ¿Qué me <em>llevo hoy</em>?</h2><div class="grid g3" style="margin-top:10px">'
+cardT('🧠✋','Prototipar es pensar con las manos','<p>No es construir el producto final: es <b>construir para pensar y aprender</b>.</p>')
+cardT('🪜','Hay niveles de fidelidad','<p><b>Baja, media y alta</b>, cada una con un propósito distinto.</p>')
+cardT('⏩','El feedback temprano suma','<p>Entre más rápido lo recibes, <b>más sólido</b> llega tu proyecto del UChallenge.</p>')+'</div>'
+'<div class="callout or">✏️ Escribe tu frase: <b>“Hoy me llevo…”</b> <button class="btn" style="font-size:22px;padding:8px 20px;margin-left:14px" data-act="rand">🎲 Equipo al azar</button></div>'
+'<div class="row" style="margin-top:20px;gap:26px;align-items:center"><div class="qrbox" style="position:static;width:220px;padding:12px">'+QR+'</div><div><p style="font-size:34px"><b>📲 Repasa en tu celular</b></p><p class="sm" style="font-size:28px">Escanea el QR: material de estudio y la <b>Arena del Prototipo</b> para jugar solo.</p><p class="sm">Siguiente sesión: Diseño de prototipo (se habilita al terminar la actividad de hoy).</p></div></div>';}});

/* ================= Render ================= */
function ensurePairs(){
  const ids=S.teams.map(t=>t.id);
  let ok=S.pairs&&S.pairs.flat().length===ids.length&&S.pairs.flat().every(i=>ids.indexOf(i)>-1);
  if(!ok){makePairs();}
}
function makePairs(){
  const ids=shuffle(S.teams.map(t=>t.id)),p=[];
  for(let i=0;i<ids.length;i+=2)p.push(ids.slice(i,i+2));
  if(p.length>1&&p[p.length-1].length===1){const l=p.pop();p[p.length-1].push(l[0]);}
  S.pairs=p;
}
function applyRv(){
  const s=SL[S.idx],n=S.rvn[s.id]||0;
  sl.querySelectorAll('.rv').forEach((el,i)=>{if(i<n)el.classList.add('on');});
}
function render(){
  const s=SL[S.idx];
  cv.classList.toggle('game',!!s.game);
  sl.innerHTML='<div class="top"><span class="kick">'+s.blk+'</span><span class="tm">⏱ min '+s.t+'</span></div>'+s.html(s);
  applyRv();
  $('#ct').textContent=(S.idx+1)+' / '+SL.length;
  $('#prog').style.width=((S.idx+1)/SL.length*100)+'%';
  if($('#notes').style.display==='block')showNotes();
  if($('#score').style.display==='block')renderScore();
  save();
}
function go(i){S.idx=Math.max(0,Math.min(SL.length-1,i));render();}
function next(){
  const hid=sl.querySelector('.rv:not(.on)');
  if(hid){hid.classList.add('on');const sid=SL[S.idx].id;S.rvn[sid]=(S.rvn[sid]||0)+1;save();return;}
  go(S.idx+1);
}
function prev(){go(S.idx-1);}

/* ================= Acciones de diapositiva ================= */
const ACT={
  cyc:function(b){
    const sid=b.dataset.sid,id=+b.dataset.team;if(S.rev[sid])return;
    const sd=SL.find(x=>x.id===sid);const n=sd.vote.opts.length;
    const v=S.votes[sid]||(S.votes[sid]={});
    const cur=(v[id]===undefined)?-1:v[id];const nx=cur+1>=n?-1:cur+1;
    if(nx<0)delete v[id];else v[id]=nx;
    render();
  },
  reveal:function(b){
    const sid=b.dataset.sid,sd=SL.find(x=>x.id===sid),o=sd.vote,v=S.votes[sid]||{};
    if(!S.rev[sid]){
      S.rev[sid]=true;
      S.teams.forEach(function(t){
        const i=v[t.id];if(i===undefined)return;
        const p=o.ptsByOpt?o.ptsByOpt[i]:(i===o.correct?o.pts:0);
        if(p)addLog(t.id,p,'vote',sid);
      });
      if(o.correct!=null){const any=S.teams.some(t=>v[t.id]===o.correct);sfx(any?'ok':'no');if(any)burst();}
    }else{
      delete S.rev[sid];S.log=S.log.filter(l=>!(l.sid===sid&&l.why==='vote'));
    }
    render();
  },
  flip:function(b){b.classList.toggle('f');},
  teams:function(){openTeams();},
  rand:function(){randTeam();},
  timer:function(b){const s=+b.dataset.sec;if(!s){stopTimer();return;}startTimer(s);},
  pairs:function(){makePairs();render();},
  clueNext:function(b){const c=S.clue[b.dataset.sid];if(c.n<3)c.n++;render();},
  clueNone:function(b){const c=S.clue[b.dataset.sid];c.w=0;render();},
  clueTeam:function(b){const sid=b.dataset.sid,c=S.clue[sid];if(c.w!==null)return;const id=+b.dataset.team;c.w=id;addLog(id,[3,2,1][c.n-1],'pista',sid);render();},
  clueReset:function(b){const sid=b.dataset.sid;S.log=S.log.filter(l=>!(l.sid===sid&&l.why==='pista'));S.clue[sid]={n:1,w:null};render();},
  giveStars:function(){
    const r=S.teams.map(t=>({t:t,p:pts(t.id)})).sort((a,b)=>b.p-a.p).slice(0,3);
    r.forEach(x=>{S.stars[x.t.id]=1;});render();
  },
  pickT:function(b){S.steal.t=+b.dataset.team;if(S.steal.v==S.steal.t)S.steal.v=null;render();},
  pickV:function(b){S.steal.v=+b.dataset.team;render();},
  amt:function(b){S.steal.n=+b.dataset.n;render();},
  doSteal:function(){
    const st=S.steal;if(!st.t||!st.v)return;
    const take=Math.min(st.n,Math.max(0,pts(st.v)));
    if(take>0){addLog(st.v,-take,'robo',''); addLog(st.t,take,'robo','');}
    S.stars[st.t]=0;S.steal={t:null,v:null,n:1};render();
  }
};
let rolling=false;
Object.assign(ACT,{
  cStart:function(b){const c=cs(b.dataset.sid);Object.assign(c,{st:'run',n:1,el:0,t0:Date.now(),buzz:null,locked:[],w:null});sfx('start');render();},
  cBuzz:function(b){const c=cs(b.dataset.sid);if(c.st!=='run')return;const id=+b.dataset.team;if(c.locked.indexOf(id)>-1)return;c.el=(Date.now()-c.t0)/1000;c.st='buzz';c.buzz=id;sfx('buzz');render();},
  cOk:function(b){const sid=b.dataset.sid,c=cs(sid),id=c.buzz;addLog(id,[3,2,1][c.n-1],'pista',sid);c.w=id;c.st='done';sfx('ok');burst();render();},
  cNo:function(b){const sid=b.dataset.sid,c=cs(sid),id=c.buzz;if(pts(id)>0)addLog(id,-1,'pista',sid);c.locked.push(id);c.buzz=null;c.st='run';c.t0=Date.now()-c.el*1000;sfx('no');render();},
  cReset:function(b){const sid=b.dataset.sid;S.log=S.log.filter(l=>!(l.sid===sid&&l.why==='pista'));delete S.clue[sid];render();},
  bcell:function(b){const sid=b.dataset.sid,id=+b.dataset.team,i=+b.dataset.i;const v=S.votes[sid]||(S.votes[sid]={});if(v[id]===i)delete v[id];else v[id]=i;render();},
  bbet:function(b){const sid=b.dataset.sid,id=+b.dataset.team;const bt=S.bets[sid]||(S.bets[sid]={});bt[id]=((bt[id]||1)%3)+1;render();},
  bReveal:function(b){
    const sid=b.dataset.sid,o=SL.find(x=>x.id===sid).bet,v=S.votes[sid]||{},bt=S.bets[sid]||{};
    if(!S.rev[sid]){
      S.rev[sid]=true;let any=false;
      S.teams.forEach(function(t){const i=v[t.id];if(i===undefined)return;const bb=bt[t.id]||1;
        if(i===o.correct){addLog(t.id,bb,'bet',sid);any=true;}
        else{const loss=Math.min(bb,Math.max(0,pts(t.id)));if(loss>0)addLog(t.id,-loss,'bet',sid);}});
      sfx(any?'ok':'no');if(any)burst();
    }else{delete S.rev[sid];S.log=S.log.filter(l=>!(l.sid===sid&&l.why==='bet'));}
    render();
  },
  roll:function(){
    const st=S.steal;if(!st.t||!st.v||rolling)return;rolling=true;let n=0;const faces=['⚀','⚁','⚂'];
    const iv=setInterval(function(){
      const d=document.getElementById('dice');if(d){d.textContent=faces[Math.floor(Math.random()*3)];}
      sfx('dice');n++;
      if(n>=14){clearInterval(iv);
        const k=1+Math.floor(Math.random()*3),take=Math.min(k,Math.max(0,pts(st.v)));
        if(take>0){addLog(st.v,-take,'robo','');addLog(st.t,take,'robo','');}
        const a=team(st.t),vv=team(st.v);S.stars[st.t]=0;
        S.steal={t:null,v:null,n:1,last:esc(a.name)+' le robó <b>'+take+'</b> pt'+(take==1?'':'s')+' a '+esc(vv.name)+' (dado: '+k+')'};
        rolling=false;sfx(take?'win':'no');if(take)burst(['🏴‍☠️','💰','⭐']);render();}
    },90);
  }
});
sl.addEventListener('click',function(e){const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b,e);});

/* ================= Marcador ================= */
function renderScore(){
  const r=S.teams.map(t=>({t:t,p:pts(t.id)})).sort((a,b)=>b.p-a.p);
  let h='<h4>🏆 Marcador</h4>';
  r.forEach(function(x,i){
    const id=x.t.id;
    h+='<div class="sr"><b>'+(i+1)+'</b><span>'+chipStatic(x.t)+(S.stars[id]?' ⭐':'')+'</span><span class="pts">'+x.p+'</span>'
      +'<div class="adj"><button data-sc="-1" data-id="'+id+'">−1</button><button data-sc="1" data-id="'+id+'">+1</button><button data-sc="2" data-id="'+id+'">+2</button><button data-sc="3" data-id="'+id+'">+3</button><button data-sc="star" data-id="'+id+'">⭐</button></div></div>';
  });
  const last=S.log.slice(-6).reverse().map(l=>{const t=team(l.team);return t?(esc(t.name)+' '+(l.d>0?'+':'')+l.d+' · '+l.why):'';}).filter(Boolean);
  h+='<div class="log">Últimos movimientos:<br>'+(last.join('<br>')||'—')+'</div><div class="help">Los puntos de votos y pistas se suman solos; usa los botones para premios manuales (avión, post-it ⭐, participación).</div>';
  $('#score').innerHTML=h;
}
$('#score').addEventListener('click',function(e){
  const b=e.target.closest('[data-sc]');if(!b)return;const id=+b.dataset.id,k=b.dataset.sc;
  if(k==='star'){S.stars[id]=S.stars[id]?0:1;}
  else{addLog(id,+k,'manual','');}
  renderScore();save();if(SL[S.idx].id==='podio'||SL[S.idx].id==='robo')render();
});

/* ================= Equipos ================= */
let resetArm=false;
function openTeams(){
  const m=$('#modal');
  let h='<h4>👥 Equipos de la clase ('+S.teams.length+')</h4>';
  S.teams.forEach(function(t){
    h+='<div class="tr"><span class="dot" style="background:'+col(t)+'"></span><input value="'+esc(t.name)+'" data-tn="'+t.id+'" maxlength="28"><button class="mini" data-td="'+t.id+'" title="Quitar equipo">✕</button></div>';
  });
  h+='<div class="row" style="margin-top:12px"><button class="mini" data-tadd="1" style="font-size:15px;padding:8px 14px">＋ Agregar equipo</button><button class="mini" data-tpre="8" style="font-size:15px;padding:8px 14px">8 equipos</button><button class="mini" data-tpre="10" style="font-size:15px;padding:8px 14px">10 equipos</button><button class="mini" data-treset="1" style="font-size:15px;padding:8px 14px;background:#5a2030">'+(resetArm?'¿Seguro? Borra puntos y votos':'↺ Reiniciar clase')+'</button></div>'
   +'<div class="help">Los nombres, puntos y votos se guardan solo en esta computadora. Cierra con <kbd>Esc</kbd>.</div><div class="row" style="margin-top:12px"><button class="btn" id="tclose" style="font-size:18px;padding:10px 22px">Listo</button></div>';
  m.innerHTML=h;m.style.display='block';
}
$('#modal').addEventListener('input',function(e){
  const id=e.target.dataset.tn;if(!id)return;const t=team(id);if(t){t.name=e.target.value||('Equipo '+t.id);save();}
});
$('#modal').addEventListener('click',function(e){
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='tclose'){closeTeams();return;}
  if(b.dataset.tadd){const id=++S.nid;S.teams.push({id:id,name:'Equipo '+(S.teams.length+1),c:S.teams.length%COLORS.length});S.pairs=null;save();openTeams();return;}
  if(b.dataset.td){const id=+b.dataset.td;S.teams=S.teams.filter(t=>t.id!==id);S.log=S.log.filter(l=>l.team!==id);S.pairs=null;
    Object.keys(S.votes).forEach(k=>{delete S.votes[k][id];});save();openTeams();return;}
  if(b.dataset.tpre){const n=+b.dataset.tpre;while(S.teams.length<n){const id=++S.nid;S.teams.push({id:id,name:'Equipo '+(S.teams.length+1),c:S.teams.length%COLORS.length});}S.pairs=null;save();openTeams();return;}
  if(b.dataset.treset){if(!resetArm){resetArm=true;openTeams();return;}
    const keep=S.teams.map(t=>({id:t.id,name:t.name,c:t.c}));const idx=S.idx;S=fresh();S.teams=keep;S.idx=idx;S.setup=true;resetArm=false;save();openTeams();render();return;}
});
function closeTeams(){$('#modal').style.display='none';resetArm=false;S.setup=true;S.pairs=null;save();render();}

/* ================= Temporizador ================= */
const T={left:0,total:0,end:0,run:false,iv:null};
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function beep(){
  try{const A=window.AudioContext||window.webkitAudioContext;const a=new A();
    [0,.28,.56].forEach(function(d){const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=d<.5?880:1175;g.gain.setValueAtTime(.0001,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.4,a.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.25);o.connect(g);g.connect(a.destination);o.start(a.currentTime+d);o.stop(a.currentTime+d+.26);});
  }catch(e){}
}
function drawT(){$('#tt').textContent=fmt(T.left);}
function startTimer(sec){stopTimer(true);T.total=sec;T.left=sec;T.end=Date.now()+sec*1000;T.run=true;$('#timer').classList.remove('end');$('#timer').style.display='flex';drawT();
  T.iv=setInterval(function(){T.left=(T.end-Date.now())/1000;if(T.left<=0){T.left=0;T.run=false;clearInterval(T.iv);drawT();$('#timer').classList.add('end');beep();}else drawT();},200);}
function stopTimer(keep){if(T.iv)clearInterval(T.iv);T.run=false;if(!keep){T.left=0;$('#timer').style.display='none';}}
$('#timer').addEventListener('click',function(e){
  const b=e.target.closest('[data-t]');if(!b)return;const k=b.dataset.t;
  if(k==='toggle'){if(T.run){T.left=(T.end-Date.now())/1000;stopTimer(true);}else if(T.left>0){T.end=Date.now()+T.left*1000;T.run=true;T.iv=setInterval(function(){T.left=(T.end-Date.now())/1000;if(T.left<=0){T.left=0;T.run=false;clearInterval(T.iv);drawT();$('#timer').classList.add('end');beep();}else drawT();},200);}}
  if(k==='reset'){stopTimer(true);T.left=T.total;T.end=Date.now()+T.left*1000;$('#timer').classList.remove('end');drawT();}
  if(k==='add60'){T.left+=60;T.end+=60000;drawT();}
  if(k==='sub60'){T.left=Math.max(0,T.left-60);T.end-=60000;drawT();}
  if(k==='hide'){stopTimer();}
});

/* ================= Equipo al azar ================= */
let rIv=null;
function randTeam(){
  if(!S.teams.length)return;
  const r=$('#rand');r.style.display='grid';const big=$('#rbig');let n=0;const total=22;
  clearInterval(rIv);
  rIv=setInterval(function(){const t=S.teams[Math.floor(Math.random()*S.teams.length)];big.textContent=t.name;big.style.color=col(t);n++;
    if(n>=total){clearInterval(rIv);}},80);
}
$('#ragain').addEventListener('click',randTeam);
$('#rclose').addEventListener('click',function(){clearInterval(rIv);$('#rand').style.display='none';});

/* ================= Ir a / Notas ================= */
function openGoto(){
  let h='<h4>☰ Ir a… ('+SL.length+' diapositivas · 80 min)</h4><div class="gg">';
  SL.forEach(function(s,i){h+='<button data-g="'+i+'" class="'+(i===S.idx?'cur':'')+'"><small>'+(i+1)+' · '+s.blk+' · min '+s.t+'</small>'+esc(s.title.replace(/<[^>]+>/g,''))+'</button>';});
  h+='</div>';$('#goto').innerHTML=h;$('#goto').style.display='block';
}
$('#goto').addEventListener('click',function(e){const b=e.target.closest('[data-g]');if(!b)return;$('#goto').style.display='none';go(+b.dataset.g);});
function showNotes(){const s=SL[S.idx];$('#notes').innerHTML='<b>Guía · '+(S.idx+1)+'. '+esc(s.title.replace(/<[^>]+>/g,''))+'</b><br>'+(s.notes||'—');$('#notes').style.display='block';}
function toggle(id,fn){const el=$(id);if(el.style.display==='block'){el.style.display='none';}else{fn?fn():el.style.display='block';}}

/* ================= Barra, teclado, fit ================= */
$('#bar').addEventListener('click',function(e){
  const b=e.target.closest('[data-b]');if(!b)return;const k=b.dataset.b;
  if(k==='prev')prev();else if(k==='next')next();else if(k==='goto')openGoto();
  else if(k==='score')toggle('#score',renderScoreShow);else if(k==='teams')openTeams();else if(k==='rand')randTeam();
  else if(k==='timer'){const t=$('#timer');if(t.style.display==='flex'){stopTimer();}else{t.style.display='flex';drawT();}}
  else if(k==='notes')toggle('#notes',showNotes);else if(k==='fs')fs();
});
function renderScoreShow(){renderScore();$('#score').style.display='block';}
function fs(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}}
function closeAll(){['#score','#modal','#goto','#notes'].forEach(s=>$(s).style.display='none');$('#rand').style.display='none';clearInterval(rIv);if(S.teams)resetArm=false;}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
  else if(k==='Home')go(0);else if(k==='End')go(SL.length-1);
  else if(k==='s'||k==='S')toggle('#score',renderScoreShow);
  else if(k==='e'||k==='E')openTeams();
  else if(k==='n'||k==='N')toggle('#notes',showNotes);
  else if(k==='g'||k==='G')openGoto();
  else if(k==='r'||k==='R')randTeam();
  else if(k==='t'||k==='T'){const t=$('#timer');if(t.style.display==='flex')stopTimer();else{t.style.display='flex';drawT();}}
  else if(k==='f'||k==='F')fs();
  else if(k==='Escape'){if($('#modal').style.display==='block'){closeTeams();}closeAll();}
});
let tx=null;
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>80){if(dx<0)next();else prev();}},{passive:true});
function fit(){const sc=Math.min(innerWidth/1920,innerHeight/1080);cv.style.transform='translate(-50%,-50%) scale('+sc+')';}
window.addEventListener('resize',fit);fit();
if(S.idx>=SL.length)S.idx=0;
render();
if(!S.setup){openTeams();}
window.__S19=function(){return {S:S,SL:SL};};
})();
</script>
